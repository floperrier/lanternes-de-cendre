  evenement.veille-basse.cohorte.origine: "Veille-Basse — volumes étanches"
  evenement.veille-basse.cohorte.titre: "La place sous le Phare éteint"
  evenement.veille-basse.cohorte.presentation: "Dix-huit personnes du camp des Digues atteignent Veille-Basse. Épuisée mais formée à la charpente étanche, la Cohorte du Sillon demande une destination durable tandis que la Colonie fragile manque déjà de filtres."
  evenement.veille-basse.cohorte.information: "La Cohorte vient du camp des Digues, compte dix-huit personnes et sait rendre habitables des volumes fissurés."
  evenement.veille-basse.cohorte.information-charge: "L’accueil occupera les équipes pendant dix minutes avant que deux équipes de charpente puissent rejoindre le convoi."
  evenement.veille-basse.cohorte.choix.accueillir: "Créer une Charge d’accueil dans la Cité-caravane"
  evenement.veille-basse.cohorte.choix.accueillir.cout: "Coût connu : dix-huit Habitants à abriter immédiatement ; deux équipes seulement après l’intégration."
  evenement.veille-basse.cohorte.choix.refuser: "Fermer les volumes de Veille-Basse"
  evenement.veille-basse.cohorte.choix.refuser.cout: "Coût connu : la Cohorte restera sur les routes et ce refus reviendra aux portes de la Colonie."
  evenement.veille-basse.cohorte.choix.rediriger: "Garantir le passage vers l’Hospice du Sillon"
  evenement.veille-basse.cohorte.choix.rediriger.cout: "Coût connu : l’Hospice portera la Charge et demandera ensuite des places filtrées."
  evenement.veille-basse.cohorte.variante.standard: "Sous la tour éteinte, chaque couchette libre a déjà un nom ; le choix porte sur la communauté qui assumera les nouveaux arrivants."
  evenement.veille-basse.cohorte.asset.alt: "Coupe du Phare éteint de Veille-Basse : la Cohorte attend devant les volumes étanches où habitants et Pèlerins préparent des couchettes."
  evenement.veille-basse.porte.origine: "Veille-Basse — porte des filtres"
  evenement.veille-basse.porte.titre: "La porte des filtres"
  evenement.veille-basse.porte.presentation: "Une rafale force le sas extérieur. Veille-Basse est avertie : sans intervention, ses deux équipes ne pourront pas maintenir simultanément les filtres, les archives et l’accueil."
  evenement.veille-basse.porte.information: "Les techniciens confirment deux réponses viables avant la prochaine rafale ; aucune perte n’est encore irréversible."
  evenement.veille-basse.porte.choix.sas: "Affecter les techniciens au renfort du sas"
  evenement.veille-basse.porte.choix.sas.cout: "Coût connu : le Marché des filtres et l’ouverture des archives attendront."
  evenement.veille-basse.porte.choix.hospice: "Ouvrir les volumes filtrés de l’Hospice"
  evenement.veille-basse.porte.choix.hospice.cout: "Coût connu : Veille-Basse reste fragile, mais la Pression d’accueil se déplace vers l’Hospice."
  evenement.veille-basse.porte.choix.renoncer: "Renoncer à intervenir avant la prochaine rafale"
  evenement.veille-basse.porte.choix.renoncer.cout: "Coût connu : l’occasion sera consignée comme ignorée ; Veille-Basse deviendra perdue au prochain Jalon local."
  evenement.veille-basse.porte.variante.standard: "Les verrous vibrent ; entre les deux rafales demeure une fenêtre assez longue pour agir."
  evenement.veille-basse.porte.asset.alt: "Dans le sas de Veille-Basse, deux techniciens retiennent une porte sous la cendre tandis que les Pèlerins montrent les volumes protégés encore accessibles."
  evenement.veille-basse.archives.origine: "Archives techniques de Veille-Basse"
  evenement.veille-basse.archives.titre: "Les registres du reflux"
  evenement.veille-basse.archives.presentation: "Les cartes de calibration montrent que le Réseau ancien protégeait les villes productives et repoussait la cendre vers les Bassins fendus. Sa désynchronisation n’a pas créé la masse : elle a libéré ce que les périphéries recevaient déjà."
  evenement.veille-basse.archives.information: "Les tracés, dates de maintenance et volumes déplacés se recoupent ; cette révélation ne dépend du témoignage d’aucun Compagnon."
  evenement.veille-basse.archives.choix.copier: "Copier les registres dans le Journal causal"
  evenement.veille-basse.archives.choix.copier.cout: "Coût connu : une équipe technique quitte les filtres le temps de sécuriser la copie."
  evenement.veille-basse.archives.choix.laisser: "Laisser les originaux sous la garde de Veille-Basse"
  evenement.veille-basse.archives.choix.laisser.cout: "Coût connu : la Cité-caravane n’emporte qu’un relevé synthétique, mais la révélation reste acquise."
  evenement.veille-basse.archives.variante.standard: "Sur la table, les anciennes courbes convergent toutes vers les mêmes territoires sacrifiés."
  evenement.veille-basse.archives.asset.alt: "Salle d’archives sans texte lisible : cartes gravées, conduites et tambours de calibration montrent la cendre déplacée des phares centraux vers les Bassins périphériques."
  evenement.veille-basse.maelys.origine: "Atelier de Veille-Basse"
  evenement.veille-basse.maelys.titre: "Maëlys et le coffret étanche"
  evenement.veille-basse.maelys.presentation: "Maëlys Rive, technicienne du Phare éteint, propose son coffret de relevés pour reconnaître les conduites de l’Hospice. Son savoir ouvre une voie plus précise ; les équipes de charpente peuvent aussi réussir sans elle."
  evenement.veille-basse.maelys.information: "Le coffret contient des jauges anciennes et un protocole que Maëlys a reconstruit, mais aucune étape ne requiert sa présence."
  evenement.veille-basse.maelys.choix.coffret: "Confier à Maëlys le relevé de l’Hospice"
  evenement.veille-basse.maelys.choix.coffret.cout: "Coût connu : Veille-Basse perd temporairement une technicienne de ses filtres."
  evenement.veille-basse.maelys.choix.equipes: "Garder Maëlys aux filtres et envoyer les charpentiers"
  evenement.veille-basse.maelys.choix.equipes.cout: "Coût connu : le relevé de l’Hospice sera plus lent, sans bloquer sa consolidation."
  evenement.veille-basse.maelys.variante.standard: "Elle pose le coffret entre vous, sans présenter sa propre présence comme le prix du succès."
  evenement.veille-basse.maelys.asset.alt: "Dans un atelier couvert, Maëlys tend un coffret de relevés au Porte-Lanterne tandis que des équipes de charpente renforcent l’Hospice au second plan."
  evenement.haut-puits.pacte.origine: "Citerne profonde de Haut-Puits"
  evenement.haut-puits.pacte.titre: "Le pacte des citernes"
  evenement.haut-puits.pacte.presentation: "Les Puits Libres proposent d’ouvrir la citerne aux familles déplacées si la cité-caravane garantit des pièces de filtration jusqu’au Conseil des Vannes."
  evenement.haut-puits.pacte.information: "Le registre de jauge confirme que le partage rendrait Haut-Puits fragile sans assécher immédiatement la citerne."
  evenement.haut-puits.pacte.choix.ouvrir: "Garantir le partage de l’Eau"
  evenement.haut-puits.pacte.choix.ouvrir.cout: "Coût connu : trente litres d’Eau du convoi soutiendront la première distribution."
  evenement.haut-puits.pacte.choix.garantir: "Garantir d’abord l’autonomie de Haut-Puits"
  evenement.haut-puits.pacte.choix.garantir.cout: "Coût connu : les familles déplacées seront écartées jusqu’au Conseil des Vannes."
  evenement.haut-puits.pacte.variante.standard: "Les marques de niveau traversent la paroi de la citerne comme les anneaux d’une dette ancienne."
  evenement.haut-puits.pacte.asset.alt: "Autour de la vanne de la citerne profonde, les délégués des Puits Libres et les familles déplacées attendent la décision du Porte-Lanterne."
  evenement.haut-puits.vanniers.origine: "Chemin des Vanniers"
  evenement.haut-puits.vanniers.titre: "Les Vanniers sous le panache"
  evenement.haut-puits.vanniers.presentation: "Le halo du convoi a poussé une langue de cendre vers les ateliers des Vanniers. Haut-Puits demande qui portera les boues nécessaires à son confinement."
  evenement.haut-puits.vanniers.information: "Les relevés datés relient le panache au dernier Engagement de route ; le détour reste praticable, mais sans retour normal."
  evenement.haut-puits.vanniers.choix.confiner: "Confiner les boues avec les équipes du convoi"
  evenement.haut-puits.vanniers.choix.confiner.cout: "Coût connu : les équipes d’Entretien délaisseront un chantier pendant la prochaine veille."
  evenement.haut-puits.vanniers.choix.deriver: "Dériver le panache vers le bassin vide"
  evenement.haut-puits.vanniers.choix.deriver.cout: "Coût connu : les Puits Libres porteront cette nouvelle nuisance au Conseil des Vannes."
  evenement.haut-puits.vanniers.variante.standard: "Des paniers de roseaux enduits de cendre balisent la dérive jusqu’aux ateliers suspendus."
  evenement.haut-puits.vanniers.asset.alt: "Les ateliers des Vanniers apparaissent sous un panache de cendre balisé par des paniers de roseaux."
  evenement.haut-puits.boues.origine: "Maison des Filtres"
  evenement.haut-puits.boues.titre: "Ce que retient le Décanteur"
  evenement.haut-puits.boues.presentation: "Les boues confinées prouvent qu’un Décanteur itinérant sécuriserait des sources contaminées, tandis que les plans de sas pourraient servir à une Arche des déplacés."
  evenement.haut-puits.boues.information: "Les deux projets réclament un châssis entier et restent incompatibles avec une transformation gratuite ou instantanée."
  evenement.haut-puits.boues.choix.decanteur: "Consigner le procédé du Décanteur itinérant"
  evenement.haut-puits.boues.choix.decanteur.cout: "Coût connu : les résidus occuperaient de la Charge et exigeraient un confinement durable."
  evenement.haut-puits.boues.choix.arche: "Adapter les sas pour l’Arche des déplacés"
  evenement.haut-puits.boues.choix.arche.cout: "Coût connu : l’accueil augmenterait immédiatement les besoins en Eau, Vivres et Chaleur."
  evenement.haut-puits.boues.variante.standard: "Deux jeux de plans restent ouverts côte à côte ; aucun ne désigne à lui seul la forme future du convoi."
  evenement.haut-puits.boues.asset.alt: "Des équipes comparent des boues confinées aux plans d’un Décanteur itinérant et d’une Arche des déplacés."
  evenement.haut-puits.ilyana.origine: "Vanne de répartition"
  evenement.haut-puits.ilyana.titre: "Ilyana devant la dernière vanne"
  evenement.haut-puits.ilyana.presentation: "Ilyana demande que chaque ouverture de la citerne soit consignée avec ses bénéficiaires et son coût, même si les Puits Libres jugent ce registre intrusif."
  evenement.haut-puits.ilyana.information: "Sa proposition défend sa conviction d’une Eau sûre pour tous sans lui donner autorité sur le Conseil."
  evenement.haut-puits.ilyana.choix.confier: "Lui confier le registre de partage"
  evenement.haut-puits.ilyana.choix.confier.cout: "Coût connu : sa parole engagera personnellement l’Intendance au Conseil des Vannes."
  evenement.haut-puits.ilyana.choix.collectif: "Garder le registre sous arbitrage collectif"
  evenement.haut-puits.ilyana.choix.collectif.cout: "Coût connu : Ilyana restera consultée, mais sa garantie ne sera pas reconnue."
  evenement.haut-puits.ilyana.variante.standard: "Elle pose son crayon sur le registre plutôt que sur la vanne, laissant la décision au Porte-Lanterne."
  evenement.haut-puits.ilyana.asset.alt: "Ilyana tient un registre ouvert devant la vanne de Haut-Puits tandis que les délégués attendent la décision."
  journal.titre.bassins.nacelles.accord-regional: "Contrepoids partagés entre les deux rives"
  journal.titre.bassins.nacelles.passage-restreint: "Passage des Nacelles réservé"
  journal.titre.bassins.nacelles.cible-frein-balisee: "Frein magnétique balisé comme Cible clandestine"
  journal.titre.bassins.nacelles.cible-frein-consignee: "Frein magnétique consigné comme Cible clandestine"
  journal.titre.bassins.nacelles.frein-reaccorde: "Frein des Nacelles réaccordé publiquement"
  journal.titre.bassins.nacelles.frein-transforme-clandestinement: "Frein des Nacelles transformé clandestinement"
  journal.titre.bassins.nacelles.trace-laiton-persistante: "Trace de limaille de laiton persistante"
  journal.titre.bassins.nacelles.conseil-passage-partage: "Passage partagé préparé pour le Conseil"
  journal.titre.bassins.nacelles.conseil-maintenance-commune: "Maintenance commune préparée pour le Conseil"
  journal.cause.bassins.nacelles.le-poids-des-deux-rives: "Le poids des deux rives"
  journal.cause.bassins.nacelles.le-frein-sous-la-cendre: "Le frein sous la cendre"
  journal.cause.bassins.nacelles.la-main-sur-le-frein: "La main sur le frein"
  journal.cause.bassins.nacelles.deux-voix-dans-le-cable: "Deux voix dans le câble"
  journal.acteur.nacelliers-des-vannes: "Nacelliers des Vannes"
  journal.acteur.frein-magnetique-des-nacelles: "Frein magnétique des Nacelles"
  journal.cible.nacelliers-des-vannes: "Nacelliers des Vannes"
  journal.cible.frein-magnetique-des-nacelles: "Frein magnétique des Nacelles"
  evenement.nacelles.conflit.origine: "Relais des Nacelles"
  evenement.nacelles.conflit.titre: "Le poids des deux rives"
  evenement.nacelles.conflit.presentation: "Les nacelles ne peuvent porter à la fois les réserves de Haut-Puits et toutes les familles venues de Veille-Basse. Les Puits Libres et les Pèlerins réclament chacun la priorité promise en amont."
  evenement.nacelles.conflit.information: "Le coût réellement payé pour atteindre le Relais porte déjà la marque des deux Colonies, de la Cohorte, du panache et de leurs Factions."
  evenement.nacelles.conflit.choix.partager: "Répartir les contrepoids entre les deux rives"
  evenement.nacelles.conflit.choix.partager.cout: "Coût connu : 4 Matériaux renforcent les cages communes ; aucun choix antérieur n’est annulé."
  evenement.nacelles.conflit.choix.reserver: "Réserver la prochaine cage au convoi"
  evenement.nacelles.conflit.choix.reserver.cout: "Coût connu : 8 L d’Eau compensent l’attente imposée aux voyageurs des deux rives."
  evenement.nacelles.conflit.variante.ilyana-garante: "Le registre confié à Ilyana précède le convoi sur le câble : les Nacelliers traitent la garantie de partage de Haut-Puits comme une parole opposable."
  evenement.nacelles.conflit.variante.ilyana-contredite: "Le registre resté collectif arrive sans garante désignée : les Nacelliers exigent que chaque priorité de Haut-Puits soit renégociée au Relais."
  evenement.nacelles.conflit.variante.maelys-mission: "Le coffret confié à Maëlys documente les charges de la rive basse : sa mission donne aux techniciens de Veille-Basse une voix dans la répartition."
  evenement.nacelles.conflit.variante.maelys-equipes: "Les équipes gardées à Veille-Basse ne peuvent renforcer les câbles : leur absence rend visible le prix de la priorité donnée à la Colonie."
  evenement.nacelles.conflit.variante.veille-abandonnee: "La rive basse n’envoie ni coffret ni équipe : le refus d’intervenir à Veille-Basse revient comme une place vide dans chaque cage."
  evenement.nacelles.conflit.variante.standard: "Les registres d’approche restent ouverts côte à côte : aucun délégué ne peut effacer la rive opposée."
  evenement.nacelles.conflit.asset.alt: "Deux nacelles suspendues se font face au-dessus d’un bassin de cendre, entourées de voyageurs de Haut-Puits et de Veille-Basse qui répartissent les contrepoids."
  evenement.nacelles.mystere.origine: "Machinerie sous le Relais"
  evenement.nacelles.mystere.titre: "Le frein sous la cendre"
  evenement.nacelles.mystere.presentation: "Sous le tambour principal, un frein magnétique du Réseau ancien module encore chaque charge. Ses impulsions concordent avec les registres montrant le déplacement historique de la cendre vers les périphéries."
  evenement.nacelles.mystere.information: "Le boîtier, son alimentation et sa transmission sont localisés : le frein magnétique est désormais une Cible clandestine concrète, limitée à ce passage."
  evenement.nacelles.mystere.choix.baliser: "Baliser le boîtier et ses témoins"
  evenement.nacelles.mystere.choix.baliser.cout: "Coût connu : les Nacelliers sauront exactement quelle infrastructure a été désignée."
  evenement.nacelles.mystere.choix.consigner: "Consigner le frein dans le Journal causal"
  evenement.nacelles.mystere.choix.consigner.cout: "Coût connu : le renseignement quitte le cercle des seuls techniciens, sans déclencher d’opération."
  evenement.nacelles.mystere.variante.standard: "La plaque de laiton porte le même motif que les courbes de reflux copiées à Veille-Basse."
  evenement.nacelles.mystere.asset.alt: "Sous le tambour d’une nacelle, des techniciens découvrent un frein magnétique ancien relié à une plaque de laiton et le balisent sans le toucher."
  evenement.nacelles.systeme.origine: "Frein magnétique des Nacelles"
  evenement.nacelles.systeme.titre: "La main sur le frein"
  evenement.nacelles.systeme.presentation: "La Cible révélée peut être réparée au grand jour ou transformée sans consentement pour rendre les charges impossibles à discriminer. L’opération cachée toucherait une infrastructure précise et laisserait une enquête possible."
  evenement.nacelles.systeme.information: "Toute ouverture du boîtier disperse une limaille de laiton identifiable ; elle survivra au changement de Région comme Trace clandestine."
  evenement.nacelles.systeme.choix.reparer: "Réaccorder publiquement le frein"
  evenement.nacelles.systeme.choix.reparer.cout: "Coût connu : 6 Matériaux et un accord public des Nacelliers."
  evenement.nacelles.systeme.choix.clandestin: "Transformer clandestinement le frein révélé"
  evenement.nacelles.systeme.choix.clandestin.cout: "Coût connu : 2 Matériaux ; une Trace persistante pourra nourrir doute, accusation ou preuve."
  evenement.nacelles.systeme.variante.standard: "Le capot reste ouvert devant vous ; la différence entre réparation et intervention cachée est explicite."
  evenement.nacelles.systeme.asset.alt: "Une main gantée hésite au-dessus du frein magnétique ouvert tandis que de la limaille de laiton brillante tombe sur un tissu de relevé."
  evenement.nacelles.compagnons.origine: "Passerelle du Relais"
  evenement.nacelles.compagnons.titre: "Deux voix dans le câble"
  evenement.nacelles.compagnons.presentation: "Ilyana Voss défend un registre commun des passages ; Maëlys Rive veut que les équipes capables d’entretenir les câbles circulent entre les Colonies. Elles formulent deux options compatibles avec les faits acquis, sans réclamer d’autorité personnelle."
  evenement.nacelles.compagnons.information.ilyana: "Ilyana relie la proposition de passage partagé aux engagements hydriques pris à Haut-Puits."
  evenement.nacelles.compagnons.information.maelys: "Maëlys relie la maintenance commune au devenir de la Cohorte et aux techniciens de Veille-Basse."
  evenement.nacelles.compagnons.choix.partage: "Porter le passage partagé au Conseil des Vannes"
  evenement.nacelles.compagnons.choix.partage.cout: "Coût connu : les priorités de passage devront rester publiques et contestables."
  evenement.nacelles.compagnons.choix.maintenance: "Porter la maintenance commune au Conseil des Vannes"
  evenement.nacelles.compagnons.choix.maintenance.cout: "Coût connu : chaque Colonie cédera périodiquement une équipe au Relais."
  evenement.nacelles.compagnons.variante.standard: "Les deux Compagnes parlent depuis des rives différentes, puis nouent leurs propositions au même câble."
  evenement.nacelles.compagnons.asset.alt: "Ilyana et Maëlys se tiennent sur une passerelle de nacelles, l’une avec un registre et l’autre avec un coffret de relevés, face aux câbles tendus vers les deux rives."
