  evenement.convergence.officiel.origine: "Comptoir officiel du Marché des Traverses"
  evenement.convergence.officiel.titre: "Les services de la voie principale"
  evenement.convergence.officiel.presentation: "Le comptoir républicain n’ouvre qu’une fois son registre. Son offre dépend de ce que Grand-Aiguillage a conservé : un coupleur calibré ou une place de service lourd contre une réserve de refroidissement."
  evenement.convergence.officiel.information: "Les deux moyens d’échange sont bornés et ferment le comptoir ; l’un prépare directement la Pièce, l’autre préserve une capacité d’atelier pour l’Aiguillage Zéro."
  evenement.convergence.officiel.choix.coupleur: "Acheter le coupleur officiel calibré"
  evenement.convergence.officiel.choix.coupleur.cout: "Coût connu : 6 Matériaux ; le coupleur devient une option documentée pour la Pièce de régulation."
  evenement.convergence.officiel.choix.reserve: "Céder une réserve d’Eau de refroidissement"
  evenement.convergence.officiel.choix.reserve.cout: "Coût connu : 8 Eau ; un service lourd reste mobilisable sans acheter le coupleur."
  evenement.convergence.officiel.variante.train: "Le Train-outil annoncé garantit la cote du coupleur, mais lie sa traçabilité aux registres républicains."
  evenement.convergence.officiel.variante.ateliers: "Les ateliers locaux ont transmis une cote compatible que les commis ne peuvent plus monopoliser."
  evenement.convergence.officiel.variante.standard: "Sans préparation venue de Grand-Aiguillage, les commis facturent surtout leur garantie et leur registre."
  evenement.convergence.officiel.asset.alt: "Un comptoir ferroviaire pèse un coupleur de régulation entre registres officiels et réservoirs d’eau de refroidissement."
  evenement.convergence.clandestin.origine: "Bascule arrière du Marché des Traverses"
  evenement.convergence.clandestin.titre: "La bascule sans manifeste"
  evenement.convergence.clandestin.presentation: "Derrière les travées officielles, les Puits Libres proposent leur dernier lot de filtres sans marque. La Bascule des manifestes peut aussi être débranchée pour soustraire un chargement, mais ses plombs garderont une Trace."
  evenement.convergence.clandestin.information: "L’Intervention vise la transmission de pesée elle-même : un fil rompu, un plomb déplacé et un horaire suffiront à l’attribuer plus tard."
  evenement.convergence.clandestin.choix.filtres: "Échanger deux doses de Remèdes contre les filtres"
  evenement.convergence.clandestin.choix.filtres.cout: "Coût connu : 2 Remèdes ; l’unique lot sans marque rejoint les réserves liées à Traverse-Libre."
  evenement.convergence.clandestin.choix.intervention: "Débrancher la transmission de la Bascule"
  evenement.convergence.clandestin.choix.intervention.cout: "Coût connu : aucun stock immédiat ; la transmission concrète est neutralisée et une Trace attribuable demeure sur ses plombs."
  evenement.convergence.clandestin.variante.aidee: "Les bâches déjà passées à Pompe-Neuve donnent aux porteurs une filière discrète, mais pas une seconde offre."
  evenement.convergence.clandestin.variante.publique: "Le manifeste public de Traverse-Libre oblige les porteurs à séparer strictement les caisses sans marque."
  evenement.convergence.clandestin.variante.standard: "Les besoins critiques de Traverse-Libre fixent la valeur du dernier lot bien au-dessus de son poids."
  evenement.convergence.clandestin.asset.alt: "Des porteurs déplacent des filtres sans marque derrière une grande bascule dont la transmission plombée peut être débranchée."
  evenement.convergence.interface.origine: "Enclave technique de Signal-Zéro"
  evenement.convergence.interface.titre: "L’interface aux deux fréquences"
  evenement.convergence.interface.presentation: "L’interface de la Ligne Zéro accepte la cadence du Rail comme celle des balises libres. Les deux lectures révèlent les cotes de la Pièce de régulation ; aucune ne commande la route à prendre."
  evenement.convergence.interface.information: "La fréquence républicaine documente le verrouillage lourd ; la fréquence des Puits Libres révèle le dégagement manuel et le contournement."
  evenement.convergence.interface.choix.rail: "Lire la fréquence calibrée du Rail"
  evenement.convergence.interface.choix.rail.cout: "Coût connu : la procédure lourde devient lisible sans accorder de monopole ni engager un itinéraire."
  evenement.convergence.interface.choix.puits: "Lire la fréquence reprise par les Puits Libres"
  evenement.convergence.interface.choix.puits.cout: "Coût connu : le dégagement manuel devient lisible sans condamner la voie principale."
  evenement.convergence.interface.variante.ligne-zero: "Le relevé du Déversoir confirme le même ordre d’impulsions sous une autre enveloppe mécanique."
  evenement.convergence.interface.variante.standard: "Les techniciens reconnaissent la compatibilité, mais ignorent encore où la première interface fut relevée."
  evenement.convergence.interface.asset.alt: "Une console ancienne de la Ligne Zéro affiche deux rythmes lumineux compatibles devant des techniciens du Rail et des Puits Libres."
  evenement.convergence.echos.origine: "Table de verre de Signal-Zéro"
  evenement.convergence.echos.titre: "Les deux branches dans le verre"
  evenement.convergence.echos.presentation: "La table restitue Grand-Aiguillage et Traverse-Libre côte à côte : leurs préparatifs, leurs absences et leurs dettes ouvrent des moyens différents d’aborder l’Aiguillage Zéro."
  evenement.convergence.echos.information: "Train-outil, réparation locale, Attelage fédéré, Galerie étayée, contournement et publicité de l’aide modifient les options ; aucun de ces échos ne choisit encore le climax."
  evenement.convergence.echos.choix.graver: "Graver les deux états sur une même plaque"
  evenement.convergence.echos.choix.graver.cout: "Coût connu : les deux Colonies pourront opposer leurs preuves lors du climax régional."
  evenement.convergence.echos.choix.isoler: "Isoler les fréquences sur deux plaques"
  evenement.convergence.echos.choix.isoler.cout: "Coût connu : chaque axe garde son autonomie, mais leurs preuves devront être rapprochées au Conseil."
  evenement.convergence.echos.variante.train: "Le Train-outil apparaît comme une préparation républicaine de la Pièce, avec son monopole et sa dette de service."
  evenement.convergence.echos.variante.grand: "La cote des ateliers locaux apparaît dans le verre à côté du canal officiel."
  evenement.convergence.echos.variante.attelage: "L’Attelage fédéré inscrit dans le verre une variante de transport autonome et réparti."
  evenement.convergence.echos.variante.galerie: "La Galerie étayée réduit le risque du transport sans ouvrir le contournement clandestin."
  evenement.convergence.echos.variante.traverse: "Le contournement de Traverse-Libre dessine une sortie que le registre républicain ne contient pas."
  evenement.convergence.echos.variante.manifeste: "Le manifeste public de Traverse-Libre fournit une preuve opposable pour une charte partagée."
  evenement.convergence.echos.variante.standard: "Les lacunes des branches non visitées restent visibles comme des options non préparées, jamais comme des faits inventés."
  evenement.convergence.echos.asset.alt: "Une table de verre technique superpose la gare-atelier de Grand-Aiguillage et les galeries de Traverse-Libre avec leurs routes possibles."
  evenement.convergence.ilyana.origine: "Poste de consignation de Signal-Zéro"
  evenement.convergence.ilyana.titre: "Ilyana et la Trace"
  evenement.convergence.ilyana.presentation: "Ilyana peut conserver sous scellés les marques de la Bascule ou les transmettre aux techniciens. La Trace ne disparaît pas : seule change la personne capable de l’attribuer."
  evenement.convergence.ilyana.information: "Sous scellés, la preuve reste différée ; transmise, elle pourra revenir dès l’Aiguillage Zéro avec son heure, sa cible et ses plombs."
  evenement.convergence.ilyana.choix.confier: "Confier les marques à Ilyana sous scellés"
  evenement.convergence.ilyana.choix.confier.cout: "Coût connu : l’attribution est différée, mais Ilyana conserve une preuve complète."
  evenement.convergence.ilyana.choix.transmettre: "Transmettre la Trace aux techniciens de Signal-Zéro"
  evenement.convergence.ilyana.choix.transmettre.cout: "Coût connu : la Trace devient immédiatement attribuable par l’enclave technique."
  evenement.convergence.ilyana.variante.trace: "Ilyana retrouve sur le fil rompu la même poussière de cuivre que sur les plombs déplacés de la Bascule."
  evenement.convergence.ilyana.variante.intendance: "Depuis l’Intendance, Ilyana dispose déjà du registre horaire nécessaire pour sceller la preuve."
  evenement.convergence.ilyana.variante.standard: "Sans Trace clandestine, Ilyana consigne surtout l’absence de rupture afin d’empêcher une accusation fabriquée."
  evenement.convergence.ilyana.asset.alt: "Ilyana tient un fil de transmission rompu et des plombs de registre entre une boîte scellée et le pupitre de Signal-Zéro."
