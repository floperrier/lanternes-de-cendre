  evenement.couronne.tete.origine: "Dernier quai de Tête-de-Ligne"
  evenement.couronne.tete.titre: "Le décret du dernier quai"
  evenement.couronne.tete.presentation: "La République du Rail tient ici un camp fortifié et réclame des pièces de voie. Elle propose un mandat exclusif ; les équipes du quai demandent plutôt un atelier commun dont personne ne pourrait fermer les portes."
  evenement.couronne.tete.information: "La délégation venue de la Trame porte avec elle les Relations, Engagements et Soupçons laissés derrière le convoi."
  evenement.couronne.tete.choix.mandat: "Ratifier le mandat de la République"
  evenement.couronne.tete.choix.mandat.cout: "Coût connu : aucun stock ; Tête-de-Ligne est absorbée dans le réseau républicain."
  evenement.couronne.tete.choix.atelier: "Ouvrir l’atelier à toutes les délégations"
  evenement.couronne.tete.choix.atelier.cout: "Coût connu : aucun stock ; le Site reste actif sous responsabilité partagée."
  evenement.couronne.tete.variante.trace: "La Trace du vol rend chaque promesse républicaine conditionnelle et chaque inventaire contesté."
  evenement.couronne.tete.variante.charte: "La Charte partagée arrive avant le convoi et donne aux équipes locales un précédent public."
  evenement.couronne.tete.variante.standard: "Les sceaux de la République font autorité, sans effacer la voix des équipes du quai."
  evenement.couronne.tete.asset.alt: "Un camp ferroviaire fortifié entoure un dernier quai où une délégation et des ouvriers examinent des pièces de voie."
  evenement.couronne.veille.origine: "Sanctuaire de Veille-des-Trois"
  evenement.couronne.veille.titre: "Les filtres sous les phares"
  evenement.couronne.veille.presentation: "Sous trois balises mortes, les Pèlerins de Cendre maintiennent un sanctuaire technique. Ses filtres ne suffiront pas à protéger à la fois les gardiens et les relevés accumulés depuis la chute des phares."
  evenement.couronne.veille.information: "Les décisions prises à Veille-Basse déterminent qui accepte de rester, qui peut partir et quels registres sont encore crédibles."
  evenement.couronne.veille.choix.sanctuaire: "Renforcer le sanctuaire et ses gardiens"
  evenement.couronne.veille.choix.sanctuaire.cout: "Coût connu : aucun stock ; Veille-des-Trois reste active autour de ses filtres."
  evenement.couronne.veille.choix.releves: "Évacuer les relevés avant la prochaine cendre"
  evenement.couronne.veille.choix.releves.cout: "Coût connu : aucun stock ; le Site est évacué mais son renseignement demeure."
  evenement.couronne.veille.variante.registres: "Les copies de Veille-Basse permettent de distinguer les mesures anciennes des ajouts récents."
  evenement.couronne.veille.variante.cohorte: "La cohorte accueillie envoie assez de bras pour maintenir une veille sous deux balises."
  evenement.couronne.veille.variante.standard: "Les gardiens comptent les filtres en silence, sans renoncer à transmettre leurs relevés."
  evenement.couronne.veille.asset.alt: "Trois phares éteints dominent un sanctuaire de filtres où des gardiens protègent des rouleaux de relevés."
  evenement.couronne.socles.origine: "Nœud enfoui de la Couronne"
  evenement.couronne.socles.titre: "Les trois socles du nœud"
  evenement.couronne.socles.presentation: "Sous l’approche choisie, un nœud enfoui porte trois socles incompatibles en apparence : un berceau d’ancrage, un étalon de réaccord et les conduites d’un précipitateur embarqué. Ce sont des montages préparables, pas des fins déjà choisies."
  evenement.couronne.socles.information: "Chaque socle reprend une interface rencontrée dans les régions précédentes ; aucun ne fonctionne sans ressources et spécialistes adaptés."
  evenement.couronne.socles.choix.cartographier: "Cartographier les trois socles"
  evenement.couronne.socles.choix.cartographier.cout: "Coût connu : aucun stock ; les contraintes mécaniques deviennent comparables."
  evenement.couronne.socles.choix.compatibilites: "Établir la table des compatibilités"
  evenement.couronne.socles.choix.compatibilites.cout: "Coût connu : aucun stock ; les interfaces régionales deviennent transmissibles."
  evenement.couronne.socles.variante.ligne-zero: "Le relevé de la Ligne Zéro identifie immédiatement les conduites du précipitateur."
  evenement.couronne.socles.variante.interface: "L’interface lue à Signal-Zéro donne une échelle fiable à l’étalon."
  evenement.couronne.socles.variante.standard: "La forme des boulons suffit à distinguer trois familles de montage."
  evenement.couronne.socles.asset.alt: "Des équipes éclairent un nœud souterrain muni de trois socles mécaniques distincts et encore démontés."
  evenement.couronne.montages.origine: "Atelier provisoire de la Couronne"
  evenement.couronne.montages.titre: "Les montages de la Couronne"
  evenement.couronne.montages.presentation: "Les plans sont assez précis pour amorcer un montage si les matériaux et spécialistes hérités de la route le permettent. Amorcer prépare une possibilité ; cela ne sélectionne ni doctrine ni issue finale."
  evenement.couronne.montages.information: "Le berceau demande un savoir ferroviaire, l’étalon les lectures complètes de Signal-Zéro et le précipitateur un relevé hydraulique ou un Décanteur documenté."
  evenement.couronne.montages.choix.berceau: "Amorcer le Berceau d’ancrage"
  evenement.couronne.montages.choix.berceau.cout: "Coût connu : 8 Matériaux et une expertise ferroviaire disponible."
  evenement.couronne.montages.choix.etalon: "Calibrer l’Étalon de réaccord"
  evenement.couronne.montages.choix.etalon.cout: "Coût connu : 6 Matériaux et les deux lectures de Signal-Zéro."
  evenement.couronne.montages.choix.precipitateur: "Assembler le Précipitateur embarqué"
  evenement.couronne.montages.choix.precipitateur.cout: "Coût connu : 10 Matériaux et une référence hydraulique documentée."
  evenement.couronne.montages.choix.reporter: "Reporter les préparatifs et conserver les plans"
  evenement.couronne.montages.choix.reporter.cout: "Coût connu : aucun stock ; les trois possibilités restent documentées."
  evenement.couronne.montages.variante.rail: "Le Train-outil annoncé fournit des spécialistes capables d’amorcer le Berceau."
  evenement.couronne.montages.variante.ligne-zero: "La Ligne Zéro relevée donne au Précipitateur des tolérances vérifiables."
  evenement.couronne.montages.variante.standard: "Les équipes distinguent ce qu’elles peuvent préparer maintenant de ce qui exige encore un spécialiste."
  evenement.couronne.montages.asset.alt: "Un atelier de campagne présente les plans et pièces séparées d’un berceau, d’un étalon et d’un précipitateur."
  evenement.couronne.ilyana.origine: "Table des plans sous la cendre"
  evenement.couronne.ilyana.titre: "Ilyana et les plans sous cendre"
  evenement.couronne.ilyana.presentation: "Ilyana propose de garder la copie maîtresse tout en enseignant son classement. Les équipes peuvent aussi répartir chaque plan entre plusieurs ateliers : son expertise compte, sa présence ne doit jamais devenir obligatoire."
  evenement.couronne.ilyana.information: "Les deux gardes préservent les trois montages et consignent qui répondra des modifications."
  evenement.couronne.ilyana.choix.confier: "Confier la copie maîtresse à Ilyana"
  evenement.couronne.ilyana.choix.confier.cout: "Coût connu : aucun stock ; Ilyana devient garante d’une copie transmissible."
  evenement.couronne.ilyana.choix.repartir: "Répartir les plans entre les équipes"
  evenement.couronne.ilyana.choix.repartir.cout: "Coût connu : aucun stock ; aucune personne ne devient indispensable."
  evenement.couronne.ilyana.variante.garante: "Son registre de Haut-Puits donne déjà une méthode de garde et de contradiction."
  evenement.couronne.ilyana.variante.transmission: "La Trace transmise à Signal-Zéro lui rappelle qu’un registre doit pouvoir changer de mains."
  evenement.couronne.ilyana.variante.standard: "Elle laisse les plans ouverts sur la table avant de demander qui en répondra."
  evenement.couronne.ilyana.asset.alt: "Ilyana et plusieurs équipes protègent sous une toile les plans de trois montages couverts de cendre."
