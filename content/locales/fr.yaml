  evenement.aiguillage.revelation.origine: "Chambre du cœur mobile de l’Aiguillage Zéro"
  evenement.aiguillage.revelation.titre: "La Pièce et le cœur mobile"
  evenement.aiguillage.revelation.presentation: "La Pièce n’est ni un trophée ni une source d’énergie : elle règle le cœur mobile qui répartit les charges entre quatre voies. L’accord régional décidera qui peut l’actionner et répondre de ses mouvements."
  evenement.aiguillage.revelation.information: "Relever les portées ou vérifier la séquence révèle la même fonction sans sélectionner aucune Solution finale."
  evenement.aiguillage.revelation.choix.portees: "Relever les portées du cœur mobile"
  evenement.aiguillage.revelation.choix.portees.cout: "Coût connu : aucun stock ; les ateliers disposeront d’une preuve mécanique."
  evenement.aiguillage.revelation.choix.sequence: "Tester la séquence de la Ligne Zéro"
  evenement.aiguillage.revelation.choix.sequence.cout: "Coût connu : aucun stock ; les deux axes disposeront d’une preuve de compatibilité."
  evenement.aiguillage.revelation.variante.ligne-zero: "Le relevé du Déversoir prouve que la Ligne Zéro synchronisait des voies autonomes sans les subordonner."
  evenement.aiguillage.revelation.variante.standard: "La poussière des gorges suffit à reconstituer l’ordre des mouvements."
  evenement.aiguillage.revelation.asset.alt: "Des techniciens des deux axes examinent le cœur mobile à quatre branches de l’Aiguillage Zéro."
  evenement.aiguillage.conseil.origine: "Table circulaire du Conseil de l’Aiguillage Zéro"
  evenement.aiguillage.conseil.titre: "Le Conseil des voies"
  evenement.aiguillage.conseil.presentation: "Les délégations doivent trancher un accord régional de réglage et de transport : monopole, Charte partagée, vol par le contournement ou transport autonome coûteux. Cet accord ne sélectionne aucune Solution finale."
  evenement.aiguillage.conseil.information: "Train-outil et Attelage fédéré réduisent les coûts sans décider. Le transport autonome reste possible : le manque devient dette, jamais impasse."
  evenement.aiguillage.conseil.choix.monopole: "Accorder le monopole de réglage à la République"
  evenement.aiguillage.conseil.choix.monopole.cout: "Coût de base : 10 Matériaux, réduit à 2 par le Train-outil."
  evenement.aiguillage.conseil.choix.charte: "Établir une Charte de circulation partagée"
  evenement.aiguillage.conseil.choix.charte.cout: "Coût connu : 8 Matériaux pour dupliquer commandes et scellés."
  evenement.aiguillage.conseil.choix.vol: "Soustraire la Pièce par le contournement"
  evenement.aiguillage.conseil.choix.vol.cout: "Coût connu : 4 Combustible ; une Trace attribuable subsiste."
  evenement.aiguillage.conseil.choix.transport: "Assurer un transport autonome, même sans préparation"
  evenement.aiguillage.conseil.choix.transport.cout: "Coût : jusqu’à 14 Matériaux, réduit à 6 par l’Attelage ; tout déficit devient dette."
  evenement.aiguillage.conseil.variante.train: "Le Train-outil réduit le coût du monopole, mais conserve sa dépendance publique."
  evenement.aiguillage.conseil.variante.attelage: "L’Attelage réduit le coût du transport autonome sans devenir une décision automatique."
  evenement.aiguillage.conseil.variante.standard: "Les absences ferment des propositions, jamais le passage autonome."
  evenement.aiguillage.conseil.asset.alt: "Quatre délégations débattent autour d’une table montrant le Train-outil, une Charte, un contournement et un Attelage."
  evenement.aiguillage.passage.origine: "Porte aval de l’Aiguillage Zéro"
  evenement.aiguillage.passage.titre: "Le passage de la Couronne"
  evenement.aiguillage.passage.presentation: "Le Conseil énonce l’irréversibilité : après la porte, le cœur mobile verrouillera l’arrière. Accord régional, Sites, Routes, Engagements, Relations et Soupçons restent consignés pour leurs retours."
  evenement.aiguillage.passage.information: "Perte d’une Colonie ou absence d’un Compagnon ne ferme jamais le passage. Grand-Aiguillage et Traverse-Libre reçoivent chacun un état de sortie et un écho futur planifié."
  evenement.aiguillage.passage.choix.consigner: "Sceller les états de sortie avec le Conseil"
  evenement.aiguillage.passage.choix.consigner.cout: "Coût connu : aucun stock ; la porte devient engageable et le retour impossible."
  evenement.aiguillage.passage.choix.transmettre: "Transmettre le registre en avant du convoi"
  evenement.aiguillage.passage.choix.transmettre.cout: "Coût connu : aucun stock ; la Couronne recevra les échos avant l’arrivée."
  evenement.aiguillage.passage.variante.trace: "La Trace pourra revenir comme accusation, sans modifier l’accord régional."
  evenement.aiguillage.passage.variante.dette: "La dette pourra revenir comme exigence, sans bloquer la porte."
  evenement.aiguillage.passage.variante.standard: "Chaque délégation conserve une copie du registre et de l’accord régional."
  evenement.aiguillage.passage.asset.alt: "Le convoi franchit une porte qui verrouille les voies arrière et s’ouvre sur la Couronne muette."
