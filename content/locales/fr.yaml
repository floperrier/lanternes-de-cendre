  journal.cause.trame.barriere-neuve.le-permis-des-essieux: "Décision prise au contrôle des essieux de Barrière-Neuve."
  journal.cause.trame.barriere-neuve.la-taxe-des-lanternes: "Décision prise devant le registre des taxes et réquisitions."
  journal.cause.trame.grand-aiguillage.la-piece-sans-serie: "Décision prise devant la pièce de régulation sans numéro de série."
  journal.cause.trame.grand-aiguillage.l-eau-des-machines: "Décision prise devant les circuits de refroidissement des ateliers."
  journal.cause.trame.grand-aiguillage.ilyana-et-l-attelage: "Décision prise avec Ilyana au quai des attelages."
  evenement.trame.permis.origine: "Contrôle des essieux de Barrière-Neuve"
  evenement.trame.permis.titre: "Le permis des essieux"
  evenement.trame.permis.presentation: "La République du Rail ouvre la voie lourde à condition d’inscrire chaque Plateforme, chaque charge et chaque passage dans son registre."
  evenement.trame.permis.information: "Le permis n’est pas une réputation : il nomme un droit de circulation révocable et les obligations qui lui sont attachées."
  evenement.trame.permis.choix.permis: "Prendre le permis républicain"
  evenement.trame.permis.choix.permis.cout: "Coût connu : un Engagement de circulation donnera aux contrôleurs le droit d’inspecter le convoi."
  evenement.trame.permis.choix.local: "Faire reconnaître le droit local des ateliers"
  evenement.trame.permis.choix.local.cout: "Coût connu : le passage restera contesté jusqu’à Grand-Aiguillage."
  evenement.trame.permis.variante.ligne-zero: "Le relevé de la Ligne Zéro prouve que ce corridor précédait la République, sans abolir son contrôle actuel."
  evenement.trame.permis.variante.standard: "Les portiques pèsent le convoi avant d’ouvrir une seule voie."
  evenement.trame.permis.asset.alt: "La Cité-caravane attend sous le portique de Barrière-Neuve tandis que des contrôleurs inspectent ses essieux."
  evenement.trame.taxe.origine: "Guérite des taxes de Barrière-Neuve"
  evenement.trame.taxe.titre: "La taxe des lanternes"
  evenement.trame.taxe.presentation: "Le tarif peut être payé en combustible ou converti en priorité de réquisition pour les ateliers républicains."
  evenement.trame.taxe.information: "Chaque option produit un Engagement nommé, consultable et contestable ; aucune jauge de réputation ne le remplace."
  evenement.trame.taxe.choix.payer: "Acquitter la taxe en combustible"
  evenement.trame.taxe.choix.payer.cout: "Coût connu : 3 Combustible ; la circulation reste transactionnelle."
  evenement.trame.taxe.choix.requisition: "Accorder une priorité de réquisition"
  evenement.trame.taxe.choix.requisition.cout: "Coût connu : un Engagement donne priorité aux ateliers républicains lors du prochain service lourd."
  evenement.trame.taxe.variante.permis: "Le permis déjà signé transforme la taxe en clause publique du passage."
  evenement.trame.taxe.variante.standard: "Sans registre commun, chaque essieu peut être immobilisé séparément."
  evenement.trame.taxe.asset.alt: "Des fûts de combustible et des caisses de matériaux sont pesés à la guérite des taxes devant le convoi."
  evenement.trame.piece.origine: "Hall des régulateurs de Grand-Aiguillage"
  evenement.trame.piece.titre: "La pièce sans série"
  evenement.trame.piece.presentation: "Une bague de régulation compatible avec le cœur mobile dort dans un bâti ancien, mais ni la République ni les ateliers locaux ne peuvent seuls la remettre en service."
  evenement.trame.piece.information: "Le Train-outil peut l’usiner sous contrôle républicain ; les ateliers peuvent ouvrir une réparation locale plus lente sans imposer ce monopole."
  evenement.trame.piece.choix.train: "Appeler le Train-outil de la Ligne Zéro"
  evenement.trame.piece.choix.train.cout: "Coût connu : un Engagement de service lourd et 2 créneaux d’atelier seront dus à la République."
  evenement.trame.piece.choix.locale: "Ouvrir la réparation aux ateliers locaux"
  evenement.trame.piece.choix.locale.cout: "Coût connu : 2 services lourds resteront mobilisés et l’eau de refroidissement devra être assurée."
  evenement.trame.piece.variante.requisition: "La priorité déjà consentie place le Train-outil en tête de la file, mais rend sa dette immédiatement exigible."
  evenement.trame.piece.variante.standard: "Les traces d’usure prouvent que plusieurs ateliers ont déjà tenté la réparation."
  evenement.trame.piece.asset.alt: "Une vaste bague de régulation ancienne se dresse dans les ateliers ferroviaires de Grand-Aiguillage."
  evenement.trame.eau.origine: "Circuit de refroidissement de Grand-Aiguillage"
  evenement.trame.eau.titre: "L’eau des machines"
  evenement.trame.eau.presentation: "Les tours lourds chauffent plus vite que les réservoirs ne se remplissent. Le Marché ne dispose que de deux services et d’une seule réserve de refroidissement."
  evenement.trame.eau.information: "Acheter l’eau sécurise les machines ; rationner préserve le convoi mais encadre les réquisitions et ralentit l’atelier."
  evenement.trame.eau.choix.acheter: "Fournir 8 Eau aux circuits"
  evenement.trame.eau.choix.acheter.cout: "Coût connu : 8 Eau ; la réserve de refroidissement est consommée."
  evenement.trame.eau.choix.rationner: "Rationner les tours et encadrer les réquisitions"
  evenement.trame.eau.choix.rationner.cout: "Coût connu : aucun stock immédiat, mais un seul service lourd pourra fonctionner à la fois."
  evenement.trame.eau.variante.locale: "La réparation locale accepte ce rythme réduit pour conserver son autonomie."
  evenement.trame.eau.variante.standard: "Les contremaîtres attendent une règle avant de relancer les tours."
  evenement.trame.eau.asset.alt: "Des réservoirs presque vides alimentent les tours lourds fumants de Grand-Aiguillage."
  evenement.trame.attelage.origine: "Quai des attelages de Grand-Aiguillage"
  evenement.trame.attelage.titre: "Ilyana et l’attelage"
  evenement.trame.attelage.presentation: "Ilyana propose de répartir la pièce entre plusieurs remorques des Puits Libres afin qu’aucune locomotive ne puisse confisquer son transport."
  evenement.trame.attelage.information: "L’Attelage fédéré coûte des Matériaux et du temps ; le Train-outil reste plus direct mais conserve le contrôle républicain."
  evenement.trame.attelage.choix.former: "Former l’Attelage fédéré"
  evenement.trame.attelage.choix.former.cout: "Coût connu : 8 Matériaux ; le transport restera possible sans monopole républicain."
  evenement.trame.attelage.choix.train: "Réserver le Train-outil"
  evenement.trame.attelage.choix.train.cout: "Coût connu : l’Engagement de service lourd réserve la pièce à la voie principale."
  evenement.trame.attelage.variante.ilyana: "Depuis l’Intendance, Ilyana peut garantir la répartition écrite des charges entre les attelages."
  evenement.trame.attelage.variante.standard: "Les meneurs locaux exigent que chaque remorque garde un manifeste public."
  evenement.trame.attelage.asset.alt: "Ilyana organise plusieurs remorques reliées pour transporter ensemble la grande bague de régulation."
