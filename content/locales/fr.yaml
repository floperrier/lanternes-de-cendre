  evenement.veille-basse.cohorte.origine: "Veille-Basse — volumes étanches"
  evenement.veille-basse.cohorte.titre: "La place sous le Phare éteint"
  evenement.veille-basse.cohorte.presentation: "Dix-huit personnes du camp des Digues atteignent Veille-Basse. Épuisée mais formée à la charpente étanche, la Cohorte du Sillon demande une destination durable tandis que la Colonie fragile manque déjà de filtres."
  evenement.veille-basse.cohorte.information: "La Cohorte vient du camp des Digues, compte dix-huit personnes et sait rendre habitables des volumes fissurés."
  evenement.veille-basse.cohorte.information-charge: "L’accueil occupera les équipes pendant dix minutes avant que deux équipes de charpente puissent rejoindre le convoi."
  evenement.veille-basse.cohorte.choix.accueillir: "Créer une Charge d’accueil dans la Cité-caravane"
  evenement.veille-basse.cohorte.choix.accueillir.cout: "Coût connu : dix-huit Habitants à abriter immédiatement ; deux équipes seulement après l’intégration."
  evenement.veille-basse.cohorte.choix.refuser: "Fermer les volumes de Veille-Basse"
  evenement.veille-basse.cohorte.choix.refuser.cout: "Coût connu : la Cohorte restera sur les routes et ce refus reviendra aux portes de la Colonie."
  evenement.veille-basse.cohorte.choix.rediriger: "Garantir le passage vers l’Hospice du Sillon"
  evenement.veille-basse.cohorte.choix.rediriger.cout: "Coût connu : l’Hospice portera la Charge et demandera ensuite des places filtrées."
  evenement.veille-basse.cohorte.variante.standard: "Sous la tour éteinte, chaque couchette libre a déjà un nom ; le choix porte sur la communauté qui assumera les nouveaux arrivants."
  evenement.veille-basse.cohorte.asset.alt: "Coupe du Phare éteint de Veille-Basse : la Cohorte attend devant les volumes étanches où habitants et Pèlerins préparent des couchettes."
  evenement.veille-basse.porte.origine: "Veille-Basse — porte des filtres"
  evenement.veille-basse.porte.titre: "La porte des filtres"
  evenement.veille-basse.porte.presentation: "Une rafale force le sas extérieur. Veille-Basse est avertie : sans intervention, ses deux équipes ne pourront pas maintenir simultanément les filtres, les archives et l’accueil."
  evenement.veille-basse.porte.information: "Les techniciens confirment deux réponses viables avant la prochaine rafale ; aucune perte n’est encore irréversible."
  evenement.veille-basse.porte.choix.sas: "Affecter les techniciens au renfort du sas"
  evenement.veille-basse.porte.choix.sas.cout: "Coût connu : le Marché des filtres et l’ouverture des archives attendront."
  evenement.veille-basse.porte.choix.hospice: "Ouvrir les volumes filtrés de l’Hospice"
  evenement.veille-basse.porte.choix.hospice.cout: "Coût connu : Veille-Basse reste fragile, mais la Pression d’accueil se déplace vers l’Hospice."
  evenement.veille-basse.porte.choix.renoncer: "Renoncer à intervenir avant la prochaine rafale"
  evenement.veille-basse.porte.choix.renoncer.cout: "Coût connu : l’occasion sera consignée comme ignorée ; Veille-Basse deviendra perdue au prochain Jalon local."
  evenement.veille-basse.porte.variante.standard: "Les verrous vibrent ; entre les deux rafales demeure une fenêtre assez longue pour agir."
  evenement.veille-basse.porte.asset.alt: "Dans le sas de Veille-Basse, deux techniciens retiennent une porte sous la cendre tandis que les Pèlerins montrent les volumes protégés encore accessibles."
  evenement.veille-basse.archives.origine: "Archives techniques de Veille-Basse"
  evenement.veille-basse.archives.titre: "Les registres du reflux"
  evenement.veille-basse.archives.presentation: "Les cartes de calibration montrent que le Réseau ancien protégeait les villes productives et repoussait la cendre vers les Bassins fendus. Sa désynchronisation n’a pas créé la masse : elle a libéré ce que les périphéries recevaient déjà."
  evenement.veille-basse.archives.information: "Les tracés, dates de maintenance et volumes déplacés se recoupent ; cette révélation ne dépend du témoignage d’aucun Compagnon."
  evenement.veille-basse.archives.choix.copier: "Copier les registres dans le Journal causal"
  evenement.veille-basse.archives.choix.copier.cout: "Coût connu : une équipe technique quitte les filtres le temps de sécuriser la copie."
  evenement.veille-basse.archives.choix.laisser: "Laisser les originaux sous la garde de Veille-Basse"
  evenement.veille-basse.archives.choix.laisser.cout: "Coût connu : la Cité-caravane n’emporte qu’un relevé synthétique, mais la révélation reste acquise."
  evenement.veille-basse.archives.variante.standard: "Sur la table, les anciennes courbes convergent toutes vers les mêmes territoires sacrifiés."
  evenement.veille-basse.archives.asset.alt: "Salle d’archives sans texte lisible : cartes gravées, conduites et tambours de calibration montrent la cendre déplacée des phares centraux vers les Bassins périphériques."
  evenement.veille-basse.maelys.origine: "Atelier de Veille-Basse"
  evenement.veille-basse.maelys.titre: "Maëlys et le coffret étanche"
  evenement.veille-basse.maelys.presentation: "Maëlys Rive, technicienne du Phare éteint, propose son coffret de relevés pour reconnaître les conduites de l’Hospice. Son savoir ouvre une voie plus précise ; les équipes de charpente peuvent aussi réussir sans elle."
  evenement.veille-basse.maelys.information: "Le coffret contient des jauges anciennes et un protocole que Maëlys a reconstruit, mais aucune étape ne requiert sa présence."
  evenement.veille-basse.maelys.choix.coffret: "Confier à Maëlys le relevé de l’Hospice"
  evenement.veille-basse.maelys.choix.coffret.cout: "Coût connu : Veille-Basse perd temporairement une technicienne de ses filtres."
  evenement.veille-basse.maelys.choix.equipes: "Garder Maëlys aux filtres et envoyer les charpentiers"
  evenement.veille-basse.maelys.choix.equipes.cout: "Coût connu : le relevé de l’Hospice sera plus lent, sans bloquer sa consolidation."
  evenement.veille-basse.maelys.variante.standard: "Elle pose le coffret entre vous, sans présenter sa propre présence comme le prix du succès."
  evenement.veille-basse.maelys.asset.alt: "Dans un atelier couvert, Maëlys tend un coffret de relevés au Porte-Lanterne tandis que des équipes de charpente renforcent l’Hospice au second plan."
