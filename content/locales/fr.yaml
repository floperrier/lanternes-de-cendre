  journal.cause.trame.pompe-neuve.l-embranchement-sans-garde: "Décision prise devant les aiguilles sans garde de Pompe-Neuve."
  journal.cause.trame.pompe-neuve.les-filtres-du-rail: "Décision prise au dépôt de filtres de Pompe-Neuve."
  journal.cause.trame.traverse-libre.le-reservoir-sous-la-voie: "Décision prise sous la voie des réservoirs."
  journal.cause.trame.traverse-libre.la-galerie-qui-cede: "Décision prise face à l’affaissement de la Galerie."
  journal.cause.trame.traverse-libre.maelys-et-le-manifeste: "Décision prise avec Maëlys devant le registre de Traverse-Libre."
  evenement.traverse.renseignement.origine: "Aiguilles sans garde de Pompe-Neuve"
  evenement.traverse.renseignement.titre: "L’embranchement sans garde"
  evenement.traverse.renseignement.presentation: "La voie républicaine promet des contrôles et des ponts entretenus. L’embranchement des Puits Libres n’offre que des balises reprises à la main, mais personne n’y exige de permis."
  evenement.traverse.renseignement.information: "Le dernier relevé autonome confirme un passage dégradé et un détour coûteux ; demander une vérification républicaine rendra cette approche officiellement connue."
  evenement.traverse.renseignement.choix.libres: "Suivre les balises des Puits Libres"
  evenement.traverse.renseignement.choix.libres.cout: "Coût connu : autonomie préservée, avec une consommation d’Eau plus incertaine."
  evenement.traverse.renseignement.choix.republique: "Faire vérifier l’aiguillage par un agent du Rail"
  evenement.traverse.renseignement.choix.republique.cout: "Coût connu : la République apprend que le convoi emprunte l’embranchement et exige que ses mouvements soient signalés."
  evenement.traverse.renseignement.variante.ligne-zero: "Les marques de la Ligne Zéro concordent avec les balises libres sans garantir l’état des rails."
  evenement.traverse.renseignement.variante.standard: "Les mécaniciens refusent de promettre une sécurité qu’aucune équipe permanente ne peut assurer."
  evenement.traverse.renseignement.asset.alt: "Des mécaniciens replacent des balises lumineuses autour d’aiguilles rouillées tandis que la voie principale gardée brille au loin."
  evenement.traverse.filtres.origine: "Dépôt de Pompe-Neuve"
  evenement.traverse.filtres.titre: "Les filtres du rail"
  evenement.traverse.filtres.presentation: "Traverse-Libre possède l’Eau mais ses filtres et ses remèdes arrivent par des wagons républicains. Un lot bloqué à Pompe-Neuve peut partir sous bâche ou sous manifeste."
  evenement.traverse.filtres.information: "Une livraison discrète n’altère la relation publique que si elle rompt un Engagement existant ; un manifeste rend l’aide immédiatement connue."
  evenement.traverse.filtres.choix.discret: "Transférer les filtres sous les bâches des Puits Libres"
  evenement.traverse.filtres.choix.discret.cout: "Coût connu : 4 Matériaux pour reconditionner le lot ; toute clause républicaine existante serait rompue."
  evenement.traverse.filtres.choix.public: "Inscrire la livraison au manifeste du Rail"
  evenement.traverse.filtres.choix.public.cout: "Coût connu : aucun stock immédiat, mais l’aide à Traverse-Libre devient publique."
  evenement.traverse.filtres.variante.engagement: "Le contrôle déjà consigné oblige le convoi à signaler ses mouvements ; cacher la livraison romprait cet Engagement."
  evenement.traverse.filtres.variante.standard: "Sans Engagement antérieur, les bâches peuvent encore passer pour un échange local."
  evenement.traverse.filtres.asset.alt: "Des filtres cylindriques sont répartis entre un wagon officiel et des chariots bâchés des Puits Libres."
  evenement.traverse.reservoir.origine: "Plans des galeries à Pompe-Neuve"
  evenement.traverse.reservoir.titre: "Le réservoir sous la voie"
  evenement.traverse.reservoir.presentation: "Sous un ancien réservoir, une vanne porte le même profil que la Ligne Zéro. Elle commandait un passage sec contournant autrefois les rails affaissés."
  evenement.traverse.reservoir.information: "Lever la vanne consomme une réserve mais révèle le contournement ; la préserver garde davantage d’Eau sans effacer le relevé."
  evenement.traverse.reservoir.choix.lever: "Lever la vanne et relever le passage sec"
  evenement.traverse.reservoir.choix.lever.cout: "Coût connu : une des trois réserves d’Eau de Traverse-Libre est mobilisée."
  evenement.traverse.reservoir.choix.preserve: "Préserver la vanne et ses joints anciens"
  evenement.traverse.reservoir.choix.preserve.cout: "Coût connu : le contournement reste fermé jusqu’à une urgence."
  evenement.traverse.reservoir.variante.ligne-zero: "Le relevé du Déversoir confirme que cette vanne appartenait au réseau de maintenance de la Ligne Zéro."
  evenement.traverse.reservoir.variante.standard: "Les habitants ne connaissent que la comptine ouvrière qui décrit son ouverture."
  evenement.traverse.reservoir.asset.alt: "Une grande vanne ancienne sous un réservoir ouvre sur une galerie sèche marquée par la Ligne Zéro."
  evenement.traverse.galerie.origine: "Poste de surveillance de Pompe-Neuve"
  evenement.traverse.galerie.titre: "La galerie qui cède"
  evenement.traverse.galerie.presentation: "L’affaissement annoncé a gagné le dernier rail. Traverse-Libre peut étayer la galerie ou ouvrir son contournement, mais aucune issue n’est gratuite."
  evenement.traverse.galerie.information: "L’étaiement restaure une liaison précaire ; le contournement évite le rail au prix d’une dette de filtres envers les Puits Libres."
  evenement.traverse.galerie.choix.etayer: "Étayer la Galerie des Réservoirs"
  evenement.traverse.galerie.choix.etayer.cout: "Coût connu : 10 Matériaux ; la voie secondaire redevient praticable et sa cause reste consignée."
  evenement.traverse.galerie.choix.contourner: "Ouvrir le contournement des réservoirs"
  evenement.traverse.galerie.choix.contourner.cout: "Coût connu : aucun stock immédiat ; deux futurs lots de filtres seront dus aux Puits Libres."
  evenement.traverse.galerie.variante.vanne: "La vanne déjà relevée permet d’ouvrir le passage avant que le plafond ne ferme la galerie."
  evenement.traverse.galerie.variante.standard: "Il faut briser les scellés préservés pour que le passage serve d’issue."
  evenement.traverse.galerie.asset.alt: "Une galerie ferroviaire s’affaisse devant des équipes qui choisissent entre poser des étais et ouvrir un tunnel de contournement."
  evenement.traverse.maelys.origine: "Salle des registres de Traverse-Libre"
  evenement.traverse.maelys.titre: "Maëlys et le manifeste"
  evenement.traverse.maelys.presentation: "Maëlys peut publier chaque caisse et chaque détour, ou sceller le registre dans son coffret. Le premier choix protège les habitants par la preuve ; le second protège l’embranchement par la discrétion."
  evenement.traverse.maelys.information: "Un registre public rend l’aide attribuable. Un registre scellé ne touche la République que s’il dissimule la rupture d’un Engagement existant."
  evenement.traverse.maelys.choix.public: "Publier le manifeste de Traverse-Libre"
  evenement.traverse.maelys.choix.public.cout: "Coût connu : l’aide devient opposable et immédiatement connue de la République."
  evenement.traverse.maelys.choix.sceller: "Sceller le registre dans le coffret de Maëlys"
  evenement.traverse.maelys.choix.sceller.cout: "Coût connu : les Puits Libres gardent la preuve ; tout Engagement rompu pourra être attribué plus tard."
  evenement.traverse.maelys.variante.maelys: "Le coffret confié depuis Veille-Basse permet à Maëlys de signer chaque relevé sans dépendre d’un bureau du Rail."
  evenement.traverse.maelys.variante.standard: "Maëlys reconstitue le registre à partir des marques de caisse et des témoins de la galerie."
  evenement.traverse.maelys.asset.alt: "Maëlys compare un manifeste public et un registre scellé devant les délégués des Puits Libres."
