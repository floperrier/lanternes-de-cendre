version: 1
locale: fr
textes:
  evenement.prologue.signaux.origine: "Phare"
  evenement.ruban.intentions: "Intentions"
  evenement.prologue.signaux.titre: "Des signaux sous la cendre"
  evenement.prologue.signaux.presentation: "Depuis le Phare, un signalement indique une cohorte à pied derrière la formation. Vos {habitants} Habitants peuvent lui faire une place, mais le convoi devra partager ses volumes étanches."
  evenement.prologue.signaux.information: "Le rapport confirme six silhouettes et aucun véhicule à proximité."
  evenement.prologue.signaux.choix.accueillir: "Ouvrir les Foyers"
  evenement.prologue.signaux.choix.accueillir.cout: "Coût connu : {places} places occupées dans les Foyers."
  evenement.prologue.signaux.choix.orienter: "Transmettre la route de Veille-Basse"
  evenement.prologue.signaux.choix.orienter.cout: "Coût connu : la cohorte poursuit seule, hors du Halo de veille."
  evenement.prologue.signaux.variante.standard: "Leurs lampes répondent une à une au signal du Phare."
  evenement.prologue.signaux.asset.alt: "Coupe habitée de la Cité-caravane, le Phare entouré de ses Plateformes en formation en grappe."
  installation.cuisine.nom: "Cuisine-conserverie"
  installation.cuisine.service: "Préparer et conserver les rations de la Cité-caravane."
  installation.cuisine.transformation: "Vivres bruts → rations conservées"
  installation.cuisine.operationnelle: "Les rations sont préparées sans perte supplémentaire."
  installation.cuisine.degradee: "La conservation consomme davantage de Vivres."
  installation.cuisine.hors-service: "Aucune ration ne peut être stabilisée pendant la Halte."
  installation.filtration.nom: "Station de filtration"
  installation.filtration.service: "Rendre potable l’Eau récupérée sur la route."
  installation.filtration.transformation: "Eau brute → Eau potable"
  installation.filtration.operationnelle: "Le débit nominal d’Eau potable est maintenu."
  installation.filtration.degradee: "Le débit baisse et les filtres consomment plus de Matériaux."
  installation.filtration.hors-service: "Les réserves d’Eau ne peuvent plus être renouvelées."
  installation.dortoirs.nom: "Dortoirs étanches"
  installation.dortoirs.service: "Abriter les Habitants de la cendre ambiante."
  installation.dortoirs.transformation: "Chaleur + filtres → volumes habitables"
  installation.dortoirs.operationnelle: "Les volumes restent étanches et chauffés."
  installation.dortoirs.degradee: "La Chaleur demandée augmente et le confort chute."
  installation.dortoirs.hors-service: "Les Habitants doivent être relogés immédiatement."
  installation.infirmerie.nom: "Infirmerie filtrée"
  installation.infirmerie.service: "Soigner les urgences sans exposer patients ni soignants."
  installation.infirmerie.transformation: "Remèdes → soins d’urgence"
  installation.infirmerie.operationnelle: "Les urgences sont traitées dans un volume protégé."
  installation.infirmerie.degradee: "Les soins exigent plus de Remèdes et de Main-d’œuvre."
  installation.infirmerie.hors-service: "Seuls les premiers soins restent possibles."
  installation.chaudiere.nom: "Chaudière commune"
  installation.chaudiere.service: "Distribuer la Chaleur aux Quartiers mobiles."
  installation.chaudiere.transformation: "Combustible → Chaleur"
  installation.chaudiere.operationnelle: "La production thermique nominale est disponible."
  installation.chaudiere.degradee: "La consommation de Combustible augmente."
  installation.chaudiere.hors-service: "Les volumes non prioritaires doivent être délestés."
  installation.traction.nom: "Groupe de traction"
  installation.traction.service: "Maintenir la mobilité de la formation en grappe."
  installation.traction.transformation: "Combustible → traction"
  installation.traction.operationnelle: "La vitesse de route prévue reste disponible."
  installation.traction.degradee: "La consommation augmente et l’allure sûre diminue."
  installation.traction.hors-service: "La Plateforme doit être remorquée pendant le voyage."
  installation.atelier.nom: "Atelier de bord"
  installation.atelier.service: "Réparer les installations et conduire les Chantiers."
  installation.atelier.transformation: "Matériaux → réparations et pièces"
  installation.atelier.operationnelle: "Les réparations et Chantiers avancent au rythme prévu."
  installation.atelier.degradee: "Les réparations et Chantiers prennent plus de temps."
  installation.atelier.hors-service: "Aucun Chantier structurel ne peut progresser."
  installation.operations.nom: "Poste d’opérations"
  installation.operations.service: "Préparer et suivre les Expéditions depuis la Cité-caravane."
  installation.operations.transformation: "Renseignements → mandats et rapports"
  installation.operations.operationnelle: "Les rapports et ordres distants restent disponibles."
  installation.operations.degradee: "Les rapports arrivent plus tard et avec moins de contexte."
  installation.operations.hors-service: "Aucun ordre distant ne peut être transmis."
  installation.condenseur.nom: "Condenseur thermique"
  installation.condenseur.service: "Produire un appoint d’Eau indépendant d’une source locale."
  installation.condenseur.transformation: "Combustible −2/h · Eau +8/h"
  installation.condenseur.operationnelle: "Le condenseur fournit 8 L d’Eau par heure."
  installation.condenseur.degradee: "Le débit d’Eau est réduit de moitié sans baisse de consommation."
  installation.condenseur.hors-service: "Le condenseur ne fournit plus d’Eau et doit être isolé."
