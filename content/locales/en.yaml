  journal.cause.trame.barriere-neuve.la-taxe-des-lanternes: "Decision made before the tax and requisition register."
  journal.cause.trame.grand-aiguillage.la-piece-sans-serie: "Decision made before the unnumbered regulation part."
  journal.cause.trame.grand-aiguillage.l-eau-des-machines: "Decision made before the workshops’ cooling circuits."
  journal.cause.trame.grand-aiguillage.ilyana-et-l-attelage: "Decision made with Ilyana at the haulers’ platform."
  evenement.trame.permis.origine: "New Barrier axle control"
  evenement.trame.permis.titre: "The axle permit"
  evenement.trame.permis.presentation: "The Rail Republic opens the heavy route only if every Platform, load and passage is entered in its register."
  evenement.trame.permis.information: "The permit is not reputation: it names a revocable circulation right and its attached obligations."
  evenement.trame.permis.choix.permis: "Take the republican permit"
  evenement.trame.permis.choix.permis.cout: "Known cost: a circulation Commitment grants inspectors the right to inspect the convoy."
  evenement.trame.permis.choix.local: "Demand recognition of the workshops’ local right"
  evenement.trame.permis.choix.local.cout: "Known cost: passage remains contested until Grand Junction."
  evenement.trame.permis.variante.ligne-zero: "The Zero Line survey proves this corridor predates the Republic without abolishing its current control."
  evenement.trame.permis.variante.standard: "The gantries weigh the convoy before opening a single route."
  evenement.trame.permis.asset.alt: "The caravan-city waits beneath New Barrier’s gantry while inspectors examine its axles."
  evenement.trame.taxe.origine: "New Barrier tax booth"
  evenement.trame.taxe.titre: "The lantern tax"
  evenement.trame.taxe.presentation: "The tariff can be paid in fuel or converted into requisition priority for republican workshops."
  evenement.trame.taxe.information: "Each option creates a named, consultable and challengeable Commitment; no reputation gauge replaces it."
  evenement.trame.taxe.choix.payer: "Pay the tax in fuel"
  evenement.trame.taxe.choix.payer.cout: "Known cost: 3 Fuel; circulation remains transactional."
  evenement.trame.taxe.choix.requisition: "Grant requisition priority"
  evenement.trame.taxe.choix.requisition.cout: "Known cost: a Commitment gives republican workshops priority during the next heavy service."
  evenement.trame.taxe.variante.permis: "The signed permit makes the tax a public clause of passage."
  evenement.trame.taxe.variante.standard: "Without a shared register, each axle can be detained separately."
  evenement.trame.taxe.asset.alt: "Fuel drums and material crates are weighed at the tax booth before the convoy."
  evenement.trame.piece.origine: "Grand Junction regulator hall"
  evenement.trame.piece.titre: "The unnumbered part"
  evenement.trame.piece.presentation: "A regulation ring compatible with the mobile core lies in an ancient cradle, but neither the Republic nor local workshops can restore it alone."
  evenement.trame.piece.information: "The Tool Train can machine it under republican control; the workshops can open a slower local repair without imposing that monopoly."
  evenement.trame.piece.choix.train: "Call the Zero Line Tool Train"
  evenement.trame.piece.choix.train.cout: "Known cost: a heavy-service Commitment and 2 workshop slots will be owed to the Republic."
  evenement.trame.piece.choix.locale: "Open the repair to local workshops"
  evenement.trame.piece.choix.locale.cout: "Known cost: 2 heavy services remain committed and cooling water must be secured."
  evenement.trame.piece.variante.requisition: "Existing priority places the Tool Train first in line but makes its debt immediately due."
  evenement.trame.piece.variante.standard: "Wear marks prove several workshops have already attempted the repair."
  evenement.trame.piece.asset.alt: "A vast ancient regulation ring stands inside Grand Junction’s railway workshops."
  evenement.trame.eau.origine: "Grand Junction cooling circuit"
  evenement.trame.eau.titre: "Water for the machines"
  evenement.trame.eau.presentation: "Heavy lathes heat faster than the reservoirs refill. The Market holds only two services and one cooling reserve."
  evenement.trame.eau.information: "Buying water secures the machines; rationing preserves the convoy but limits requisitions and slows the workshop."
  evenement.trame.eau.choix.acheter: "Supply 8 Water to the circuits"
  evenement.trame.eau.choix.acheter.cout: "Known cost: 8 Water; the cooling reserve is consumed."
  evenement.trame.eau.choix.rationner: "Ration the lathes and limit requisitions"
  evenement.trame.eau.choix.rationner.cout: "Known cost: no immediate stock, but only one heavy service can run at a time."
  evenement.trame.eau.variante.locale: "The local repair accepts this reduced pace to preserve its autonomy."
  evenement.trame.eau.variante.standard: "The foremen await a rule before restarting the lathes."
  evenement.trame.eau.asset.alt: "Nearly empty tanks feed Grand Junction’s steaming heavy lathes."
  evenement.trame.attelage.origine: "Grand Junction haulers’ platform"
  evenement.trame.attelage.titre: "Ilyana and the hauler"
  evenement.trame.attelage.presentation: "Ilyana proposes splitting the part across several Free Wells trailers so no locomotive can confiscate its transport."
  evenement.trame.attelage.information: "The Federated Hauler costs Materials and time; the Tool Train is more direct but preserves republican control."
  evenement.trame.attelage.choix.former: "Form the Federated Hauler"
  evenement.trame.attelage.choix.former.cout: "Known cost: 8 Materials; transport remains possible without a republican monopoly."
  evenement.trame.attelage.choix.train: "Reserve the Tool Train"
  evenement.trame.attelage.choix.train.cout: "Known cost: the heavy-service Commitment reserves the part for the main route."
  evenement.trame.attelage.variante.ilyana: "From Stewardship, Ilyana can guarantee the written distribution of loads among haulers."
  evenement.trame.attelage.variante.standard: "Local drivers demand a public manifest for every trailer."
  evenement.trame.attelage.asset.alt: "Ilyana organizes several linked trailers to carry the great regulation ring together."
