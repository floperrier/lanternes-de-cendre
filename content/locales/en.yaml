  journal.titre.trame.barriere-neuve.droit-local-conteste: "Contested local right of passage"
  journal.titre.trame.barriere-neuve.taxe-des-lanternes: "Lantern tax paid"
  journal.titre.trame.barriere-neuve.priorite-aux-requisitions: "Requisition priority granted"
  journal.titre.trame.grand-aiguillage.train-outil-annonce: "Tool Train announced for the regulation part"
  journal.titre.trame.grand-aiguillage.reparation-locale-ouverte: "Local repair opened outside the monopoly"
  journal.titre.trame.grand-aiguillage.refroidissement-securise: "Workshop cooling secured"
  journal.titre.trame.grand-aiguillage.refroidissement-rationne: "Workshop cooling rationed"
  journal.titre.trame.grand-aiguillage.attelage-federe-annonce: "Federated Hauler announced"
  journal.titre.trame.grand-aiguillage.train-outil-reserve: "Tool Train reserved"
