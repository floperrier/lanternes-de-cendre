  evenement.traverse.renseignement.origine: "New Pump unattended switches"
  evenement.traverse.renseignement.titre: "The unattended branch"
  evenement.traverse.renseignement.presentation: "The republican route promises inspections and maintained bridges. The Free Wells branch offers only hand-restored markers, but no one demands a permit there."
  evenement.traverse.renseignement.information: "The last autonomous survey confirms a degraded passage and a costly detour; requesting a republican inspection makes this approach officially known."
  evenement.traverse.renseignement.choix.libres: "Follow the Free Wells markers"
  evenement.traverse.renseignement.choix.libres.cout: "Known cost: autonomy is preserved, with less certain Water consumption."
  evenement.traverse.renseignement.choix.republique: "Have a Rail agent inspect the switch"
  evenement.traverse.renseignement.choix.republique.cout: "Known cost: the Republic learns that the convoy is taking the branch and requires its movements to be reported."
  evenement.traverse.renseignement.variante.ligne-zero: "The Zero Line markings match the free markers without guaranteeing the rails’ condition."
  evenement.traverse.renseignement.variante.standard: "The mechanics refuse to promise safety that no permanent crew can guarantee."
  evenement.traverse.renseignement.asset.alt: "Mechanics replace luminous markers around rusted switches while the guarded main line glows in the distance."
  evenement.traverse.filtres.origine: "New Pump depot"
  evenement.traverse.filtres.titre: "The railway filters"
  evenement.traverse.filtres.presentation: "Free Crossing holds Water, but its filters and medicine arrive on republican cars. A lot blocked at New Pump can leave under tarps or under a manifest."
  evenement.traverse.filtres.information: "A discreet delivery changes the public relationship only if it breaks an existing Commitment; a manifest makes the aid immediately known."
  evenement.traverse.filtres.choix.discret: "Move the filters under Free Wells tarps"
  evenement.traverse.filtres.choix.discret.cout: "Known cost: 4 Materials to repackage the lot; any existing republican clause would be broken."
  evenement.traverse.filtres.choix.public: "Enter the delivery in the Rail manifest"
  evenement.traverse.filtres.choix.public.cout: "Known cost: no immediate stock, but aid to Free Crossing becomes public."
  evenement.traverse.filtres.variante.engagement: "The recorded inspection commits the convoy to report its movements; hiding the delivery would break that Commitment."
  evenement.traverse.filtres.variante.standard: "Without a prior Commitment, the tarps can still pass as a local exchange."
  evenement.traverse.filtres.asset.alt: "Cylindrical filters are split between an official railcar and tarped Free Wells carts."
  evenement.traverse.reservoir.origine: "Gallery plans at New Pump"
  evenement.traverse.reservoir.titre: "The reservoir beneath the track"
  evenement.traverse.reservoir.presentation: "Beneath an old reservoir, a valve bears the same profile as the Zero Line. It once controlled a dry passage around the collapsed rails."
  evenement.traverse.reservoir.information: "Raising the valve consumes one reserve but reveals the bypass; preserving it keeps more Water without erasing the survey."
  evenement.traverse.reservoir.choix.lever: "Raise the valve and survey the dry passage"
  evenement.traverse.reservoir.choix.lever.cout: "Known cost: one of Free Crossing’s three Water reserves is mobilized."
  evenement.traverse.reservoir.choix.preserve: "Preserve the valve and its ancient seals"
  evenement.traverse.reservoir.choix.preserve.cout: "Known cost: the bypass remains closed until an emergency."
  evenement.traverse.reservoir.variante.ligne-zero: "The Spillway survey confirms that this valve belonged to the Zero Line maintenance network."
  evenement.traverse.reservoir.variante.standard: "The inhabitants know only the workers’ rhyme that describes its opening."
  evenement.traverse.reservoir.asset.alt: "A great ancient valve beneath a reservoir opens onto a dry gallery marked by the Zero Line."
  evenement.traverse.galerie.origine: "New Pump monitoring post"
  evenement.traverse.galerie.titre: "The yielding gallery"
  evenement.traverse.galerie.presentation: "The reported collapse has reached the last rail. Free Crossing can shore up the gallery or open its bypass, but neither outcome is free."
  evenement.traverse.galerie.information: "Shoring restores a precarious link; the bypass avoids the rail at the cost of a filter debt to the Free Wells."
  evenement.traverse.galerie.choix.etayer: "Shore up Reservoir Gallery"
  evenement.traverse.galerie.choix.etayer.cout: "Known cost: 10 Materials; the secondary route becomes passable again and its cause remains recorded."
  evenement.traverse.galerie.choix.contourner: "Open the reservoir bypass"
  evenement.traverse.galerie.choix.contourner.cout: "Known cost: no immediate stock; two future filter lots will be owed to the Free Wells."
  evenement.traverse.galerie.variante.vanne: "The surveyed valve makes it possible to open the passage before the roof closes the gallery."
  evenement.traverse.galerie.variante.standard: "The preserved seals must be broken for the passage to serve as an exit."
  evenement.traverse.galerie.asset.alt: "A railway gallery collapses before crews choosing between braces and opening a bypass tunnel."
  evenement.traverse.maelys.origine: "Free Crossing records room"
  evenement.traverse.maelys.titre: "Maëlys and the manifest"
  evenement.traverse.maelys.presentation: "Maëlys can publish every crate and detour, or seal the register in her case. The first choice protects inhabitants through proof; the second protects the branch through discretion."
  evenement.traverse.maelys.information: "A public register makes the aid attributable. A sealed register affects the Republic only if it conceals a broken Commitment."
  evenement.traverse.maelys.choix.public: "Publish the Free Crossing manifest"
  evenement.traverse.maelys.choix.public.cout: "Known cost: the aid becomes enforceable and immediately known to the Republic."
  evenement.traverse.maelys.choix.sceller: "Seal the register in Maëlys’s case"
  evenement.traverse.maelys.choix.sceller.cout: "Known cost: the Free Wells keep the proof; any broken Commitment may be attributed later."
  evenement.traverse.maelys.variante.maelys: "The case entrusted since Low Watch lets Maëlys sign every survey without depending on a Rail office."
  evenement.traverse.maelys.variante.standard: "Maëlys reconstructs the register from crate marks and gallery witnesses."
  evenement.traverse.maelys.asset.alt: "Maëlys compares a public manifest and a sealed register before the Free Wells delegates."
