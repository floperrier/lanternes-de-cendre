  journal.cause.trame.aiguillage-zero.le-conseil-des-voies: "Regional agreement settled at the Zero Junction Council."
  journal.cause.trame.aiguillage-zero.le-passage-de-la-couronne: "Exit states recorded before the irreversible passage."
  evenement.aiguillage.revelation.origine: "Zero Junction mobile-heart chamber"
  evenement.aiguillage.revelation.titre: "The Part and the mobile heart"
  evenement.aiguillage.revelation.presentation: "The Part is neither a trophy nor a power source: it regulates a mobile heart across four tracks. The regional arrangement decides who may operate it and answer for it."
  evenement.aiguillage.revelation.information: "Surveying bearings or checking the sequence reveals the same function without selecting a final Solution."
  evenement.aiguillage.revelation.choix.portees: "Survey the mobile heart bearings"
  evenement.aiguillage.revelation.choix.portees.cout: "Known cost: no stock; workshops gain mechanical evidence."
  evenement.aiguillage.revelation.choix.sequence: "Test the Zero Line sequence"
  evenement.aiguillage.revelation.choix.sequence.cout: "Known cost: no stock; both axes gain compatibility evidence."
  evenement.aiguillage.revelation.variante.ligne-zero: "The Spillway survey proves the Zero Line synchronized autonomous tracks without subordinating them."
  evenement.aiguillage.revelation.variante.standard: "Dust in the grooves is enough to reconstruct the movement order."
  evenement.aiguillage.revelation.asset.alt: "Technicians from both axes examine Zero Junction’s four-branched mobile heart."
  evenement.aiguillage.conseil.origine: "Zero Junction Council circular table"
  evenement.aiguillage.conseil.titre: "The Council of tracks"
  evenement.aiguillage.conseil.presentation: "Delegations must settle a regional regulation and transport arrangement: monopoly, shared Charter, bypass theft, or costly autonomous transport. It selects no final Solution."
  evenement.aiguillage.conseil.information: "Tool Train and Federated Hauler lower costs without deciding. Autonomous transport remains possible: shortages become debt, never a dead end."
  evenement.aiguillage.conseil.choix.monopole: "Grant the Republic a regulation monopoly"
  evenement.aiguillage.conseil.choix.monopole.cout: "Base cost: 10 Materials, reduced to 2 by the Tool Train."
  evenement.aiguillage.conseil.choix.charte: "Establish a shared circulation Charter"
  evenement.aiguillage.conseil.choix.charte.cout: "Known cost: 8 Materials to duplicate controls and seals."
  evenement.aiguillage.conseil.choix.vol: "Steal the Part through the bypass"
  evenement.aiguillage.conseil.choix.vol.cout: "Known cost: 4 Fuel; an attributable Trace remains."
  evenement.aiguillage.conseil.choix.transport: "Secure autonomous transport without preparation"
  evenement.aiguillage.conseil.choix.transport.cout: "Cost: up to 14 Materials, reduced to 6 by the Hauler; shortfalls become debt."
  evenement.aiguillage.conseil.variante.train: "The Tool Train lowers monopoly cost but retains public dependence."
  evenement.aiguillage.conseil.variante.attelage: "The Hauler lowers autonomous transport cost without choosing it automatically."
  evenement.aiguillage.conseil.variante.standard: "Absences close proposals, never autonomous passage."
  evenement.aiguillage.conseil.asset.alt: "Four delegations debate around a table showing the Tool Train, Charter, bypass and Hauler."
  evenement.aiguillage.passage.origine: "Zero Junction downstream gate"
  evenement.aiguillage.passage.titre: "The Crown passage"
  evenement.aiguillage.passage.presentation: "The Council states the irreversible rule: beyond the gate the mobile heart locks the rear. Regional arrangement, Sites, Routes, Commitments, Relationships and Suspicions remain recorded for returns."
  evenement.aiguillage.passage.information: "A lost Colony or absent Companion never closes passage. Grand Junction and Free Crossing each receive an exit state and planned future echo."
  evenement.aiguillage.passage.choix.consigner: "Seal the exit states with the Council"
  evenement.aiguillage.passage.choix.consigner.cout: "Known cost: no stock; the gate becomes available and return impossible."
  evenement.aiguillage.passage.choix.transmettre: "Transmit the register ahead of the caravan"
  evenement.aiguillage.passage.choix.transmettre.cout: "Known cost: no stock; the Crown receives echoes before arrival."
  evenement.aiguillage.passage.variante.trace: "The Trace may return as an accusation without changing the regional arrangement."
  evenement.aiguillage.passage.variante.dette: "The debt may return as a claim without blocking the gate."
  evenement.aiguillage.passage.variante.standard: "Each delegation retains the exit register and regional arrangement."
  evenement.aiguillage.passage.asset.alt: "The caravan crosses a gate that locks rear tracks and opens toward the Silent Crown."
