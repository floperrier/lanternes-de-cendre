  evenement.prologue.signaux.origine: "Lighthouse"
  evenement.ruban.intentions: "Intentions"
  evenement.prologue.signaux.titre: "Signals beneath the ash"
  evenement.prologue.signaux.presentation: "A report from the lighthouse indicates a cohort on foot behind the formation. Your {habitants} inhabitants can make room for them, but the convoy will have to share its sealed quarters."
  evenement.prologue.signaux.information: "The report confirms six figures and no vehicle nearby."
  evenement.prologue.signaux.choix.accueillir: "Open the living quarters"
  evenement.prologue.signaux.choix.accueillir.cout: "Known cost: {places} places occupied in the living quarters."
  evenement.prologue.signaux.choix.orienter: "Transmit the route to Veille-Basse"
  evenement.prologue.signaux.choix.orienter.cout: "Known cost: the cohort continues alone, outside the watch halo."
  evenement.prologue.signaux.variante.standard: "Their lamps answer the lighthouse signal one by one."
  evenement.prologue.signaux.asset.alt: "Cutaway view of the caravan-city, with the lighthouse surrounded by its clustered mobile platforms."
  evenement.prologue.reponse.origine: "Mobile core chamber"
  evenement.prologue.reponse.titre: "The Lighthouse receives an answer"
  evenement.prologue.reponse.presentation: "After the cohort’s signal, the mobile core emits a harmonic absent from its plans. A distant light answers beneath the ash, along the old Zero Line."
  evenement.prologue.reponse.information: "The needles repeated the same interval three times; this is neither a fault nor an echo from the Halo."
  evenement.prologue.reponse.choix.consigner: "Record the harmonic for the road"
  evenement.prologue.reponse.choix.consigner.cout: "Known cost: the Workshop diverts one crew during the next watch."
  evenement.prologue.reponse.choix.etouffer: "Muffle the signal until the Halt"
  evenement.prologue.reponse.choix.etouffer.cout: "Known cost: the trail to the answering Lighthouse may go cold."
  evenement.prologue.reponse.variante.standard: "Inside the Lighthouse conduits, metal vibrates like a string silent for too long."
  evenement.prologue.reponse.asset.alt: "The open mobile core glows inside the Lighthouse while a second lighthouse answers in the distant ash."
  evenement.prologue.filtres.origine: "Stewardship"
  evenement.prologue.filtres.titre: "Ash in the filters"
  evenement.prologue.filtres.presentation: "The cohort’s passage and the Lighthouse answer kept the airlocks open. There are not enough clean filters for both the Hearths and the workshops until the Halt."
  evenement.prologue.filtres.information: "The gauges show one watch of margin; no sealed volume is contaminated yet."
  evenement.prologue.filtres.choix.foyers: "Reserve clean filters for the Hearths"
  evenement.prologue.filtres.choix.foyers.cout: "Known cost: the workshops will slow and maintenance will fall behind."
  evenement.prologue.filtres.choix.ateliers: "Maintain workshop airflow"
  evenement.prologue.filtres.choix.ateliers.cout: "Known cost: the Hearths will use reduced filtration until the Halt."
  evenement.prologue.filtres.variante.standard: "Black cylinders line the deck; each bears the trace of the same breath of ash."
  evenement.prologue.filtres.asset.alt: "Crews compare blackened filters between the Hearths and workshops linked by air ducts."
  evenement.prologue.ilyana.origine: "Filtration station"
  evenement.prologue.ilyana.titre: "Ilyana holds the valve"
  evenement.prologue.ilyana.presentation: "Ilyana Voss offers to isolate the secondary valve herself: twelve minutes without workshop flow would preserve water for the Hearths. Her burns make any leak dangerous to her."
  evenement.prologue.ilyana.information: "Her reading matches the Stewardship gauges and names precisely the risk she accepts."
  evenement.prologue.ilyana.choix.confier: "Entrust the valve isolation to her"
  evenement.prologue.ilyana.choix.confier.cout: "Known cost: Ilyana enters the circuit and leaves her current post."
  evenement.prologue.ilyana.choix.protocole: "Keep the collective protocol"
  evenement.prologue.ilyana.choix.protocole.cout: "Known cost: the operation will take longer and her expertise will remain sidelined."
  evenement.prologue.ilyana.variante.standard: "She keeps one hand on the valve and the other open toward you, hiding neither the solution nor its price."
  evenement.prologue.ilyana.asset.alt: "Ilyana points out the gauges and secondary valve in the filtration station while a crew intervenes."
  evenement.bassins.haut-puits.origine: "High Well"
  evenement.bassins.haut-puits.titre: "The water left in the Fractured Basins"
  evenement.bassins.haut-puits.presentation: "At the end of the first Route Segment, High Well opens its deep cistern. The Free Wells want to secure the colony’s autonomy; displaced families demand the share announced by the prologue signals."
  evenement.bassins.haut-puits.information: "The valve can serve both groups today, but the dry season makes every lasting promise costly."
  evenement.bassins.haut-puits.choix.partage: "Promise a measured share"
  evenement.bassins.haut-puits.choix.partage.cout: "Known cost: the caravan-city must contribute to the cistern’s next maintenance."
  evenement.bassins.haut-puits.choix.reserves: "Secure High Well’s reserves first"
  evenement.bassins.haut-puits.choix.reserves.cout: "Known cost: the displaced families will remember this refusal at the next Council."
  evenement.bassins.haut-puits.variante.standard: "Around the raised valve, no one disputes the shortage; the conflict is about who will bear its weight."
  evenement.bassins.haut-puits.variante.cohorte-accueillie: "The six people welcomed into the Hearths stand before the cistern: the place opened on the road now commits the convoy to sharing water."
  evenement.bassins.haut-puits.variante.cohorte-orientee: "The cohort directed to Lower Watch sent its request ahead: the promise made on the road has now reached the cistern."
  evenement.bassins.haut-puits.asset.alt: "At High Well, the Free Wells and displaced families face each other around the cistern valve."
