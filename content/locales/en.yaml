  evenement.convergence.officiel.origine: "Sleeper Market official counter"
  evenement.convergence.officiel.titre: "The main route services"
  evenement.convergence.officiel.presentation: "The republican counter opens its register only once. Its offer depends on what Grand Junction preserved: a calibrated coupler or a heavy-service slot traded for a cooling reserve."
  evenement.convergence.officiel.information: "Both means of exchange are finite and close the counter; one prepares the Part directly, while the other preserves workshop capacity for Zero Junction."
  evenement.convergence.officiel.choix.coupleur: "Buy the calibrated official coupler"
  evenement.convergence.officiel.choix.coupleur.cout: "Known cost: 6 Materials; the coupler becomes a documented option for the Regulation Part."
  evenement.convergence.officiel.choix.reserve: "Yield a cooling Water reserve"
  evenement.convergence.officiel.choix.reserve.cout: "Known cost: 8 Water; one heavy service remains available without buying the coupler."
  evenement.convergence.officiel.variante.train: "The announced Tool Train guarantees the coupler’s dimensions but ties its traceability to republican registers."
  evenement.convergence.officiel.variante.ateliers: "The local workshops transmitted a compatible dimension that the clerks can no longer monopolize."
  evenement.convergence.officiel.variante.standard: "Without preparation from Grand Junction, the clerks mostly charge for their guarantee and register."
  evenement.convergence.officiel.asset.alt: "A railway counter weighs a regulation coupler between official registers and cooling-water tanks."
  evenement.convergence.clandestin.origine: "Sleeper Market rear scales"
  evenement.convergence.clandestin.titre: "The scales without a manifest"
  evenement.convergence.clandestin.presentation: "Behind the official aisles, the Free Wells offer their last lot of unmarked filters. The manifest scales can also be disconnected to hide a load, but their seals will retain a Trace."
  evenement.convergence.clandestin.information: "The Intervention targets the weighing transmission itself: a broken wire, a displaced seal and a timestamp will be enough to attribute it later."
  evenement.convergence.clandestin.choix.filtres: "Trade two Medicine doses for the filters"
  evenement.convergence.clandestin.choix.filtres.cout: "Known cost: 2 Medicine; the only unmarked lot joins the reserves linked to Free Crossing."
  evenement.convergence.clandestin.choix.intervention: "Disconnect the scales’ transmission"
  evenement.convergence.clandestin.choix.intervention.cout: "Known cost: no immediate stock; the concrete transmission is disabled and an attributable Trace remains on its seals."
  evenement.convergence.clandestin.variante.aidee: "The tarps already passed through New Pump give the carriers a discreet channel, but not a second offer."
  evenement.convergence.clandestin.variante.publique: "Free Crossing’s public manifest forces the carriers to separate the unmarked crates strictly."
  evenement.convergence.clandestin.variante.standard: "Free Crossing’s critical needs set the last lot’s value far above its weight."
  evenement.convergence.clandestin.asset.alt: "Carriers move unmarked filters behind great scales whose sealed transmission can be disconnected."
  evenement.convergence.interface.origine: "Zero Signal technical enclave"
  evenement.convergence.interface.titre: "The two-frequency interface"
  evenement.convergence.interface.presentation: "The Zero Line interface accepts both Rail cadence and free-marker cadence. Both readings reveal the Regulation Part’s dimensions; neither commands which route to take."
  evenement.convergence.interface.information: "The republican frequency documents heavy locking; the Free Wells frequency reveals manual release and the bypass."
  evenement.convergence.interface.choix.rail: "Read the Rail’s calibrated frequency"
  evenement.convergence.interface.choix.rail.cout: "Known cost: the heavy procedure becomes legible without granting a monopoly or committing to a route."
  evenement.convergence.interface.choix.puits: "Read the frequency restored by the Free Wells"
  evenement.convergence.interface.choix.puits.cout: "Known cost: the manual release becomes legible without condemning the main route."
  evenement.convergence.interface.variante.ligne-zero: "The Spillway survey confirms the same pulse order beneath a different mechanical casing."
  evenement.convergence.interface.variante.standard: "The technicians recognize compatibility but do not yet know where the first interface was surveyed."
  evenement.convergence.interface.asset.alt: "An ancient Zero Line console displays two compatible light rhythms before Rail and Free Wells technicians."
  evenement.convergence.echos.origine: "Zero Signal glass table"
  evenement.convergence.echos.titre: "Both branches in the glass"
  evenement.convergence.echos.presentation: "The table restores Grand Junction and Free Crossing side by side: their preparations, absences and debts open different means of approaching Zero Junction."
  evenement.convergence.echos.information: "Tool Train, local repair, Federated Hauler, shored Gallery, bypass and aid publicity modify the options; none of these echoes chooses the climax yet."
  evenement.convergence.echos.choix.graver: "Engrave both states on one plate"
  evenement.convergence.echos.choix.graver.cout: "Known cost: both Colonies will be able to present their evidence during the regional climax."
  evenement.convergence.echos.choix.isoler: "Isolate the frequencies on two plates"
  evenement.convergence.echos.choix.isoler.cout: "Known cost: each axis keeps its autonomy, but their evidence must be reconciled at the Council."
  evenement.convergence.echos.variante.train: "The Tool Train appears as a republican preparation of the Part, together with its monopoly and service debt."
  evenement.convergence.echos.variante.grand: "The local workshops’ dimension appears in the glass beside the official channel."
  evenement.convergence.echos.variante.attelage: "The Federated Hauler records an autonomous, distributed transport variant in the glass."
  evenement.convergence.echos.variante.galerie: "The Shored Gallery lowers transport risk without opening the clandestine bypass."
  evenement.convergence.echos.variante.traverse: "Free Crossing’s bypass draws an exit that the republican register does not contain."
  evenement.convergence.echos.variante.manifeste: "Free Crossing’s public manifest provides enforceable evidence for a shared charter."
  evenement.convergence.echos.variante.standard: "Gaps from unvisited branches remain visible as unprepared options, never as invented facts."
  evenement.convergence.echos.asset.alt: "A technical glass table overlays Grand Junction’s railway workshop and Free Crossing’s galleries with their possible routes."
  evenement.convergence.ilyana.origine: "Zero Signal recording post"
  evenement.convergence.ilyana.titre: "Ilyana and the Trace"
  evenement.convergence.ilyana.presentation: "Ilyana can keep the scales’ marks under seal or transmit them to the technicians. The Trace does not disappear: only the person able to attribute it changes."
  evenement.convergence.ilyana.information: "Under seal, the evidence remains deferred; once transmitted, it may return at Zero Junction with its time, target and seals."
  evenement.convergence.ilyana.choix.confier: "Entrust the marks to Ilyana under seal"
  evenement.convergence.ilyana.choix.confier.cout: "Known cost: attribution is deferred, but Ilyana retains complete evidence."
  evenement.convergence.ilyana.choix.transmettre: "Transmit the Trace to Zero Signal technicians"
  evenement.convergence.ilyana.choix.transmettre.cout: "Known cost: the Trace becomes immediately attributable by the technical enclave."
  evenement.convergence.ilyana.variante.trace: "Ilyana finds the same copper dust on the broken wire and the scales’ displaced seals."
  evenement.convergence.ilyana.variante.intendance: "From Stewardship, Ilyana already has the hourly register needed to seal the evidence."
  evenement.convergence.ilyana.variante.standard: "Without a clandestine Trace, Ilyana mainly records the absence of damage to prevent a fabricated accusation."
  evenement.convergence.ilyana.asset.alt: "Ilyana holds a broken transmission wire and register seals between a sealed box and the Zero Signal console."
