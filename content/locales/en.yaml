version: 1
locale: en
textes:
  evenement.prologue.signaux.origine: "Lighthouse"
  evenement.ruban.intentions: "Intentions"
  evenement.prologue.signaux.titre: "Signals beneath the ash"
  evenement.prologue.signaux.presentation: "A report from the lighthouse indicates a cohort on foot behind the formation. Your {habitants} inhabitants can make room for them, but the convoy will have to share its sealed quarters."
  evenement.prologue.signaux.information: "The report confirms six figures and no vehicle nearby."
  evenement.prologue.signaux.choix.accueillir: "Open the living quarters"
  evenement.prologue.signaux.choix.accueillir.cout: "Known cost: {places} places occupied in the living quarters."
  evenement.prologue.signaux.choix.orienter: "Transmit the route to Veille-Basse"
  evenement.prologue.signaux.choix.orienter.cout: "Known cost: the cohort continues alone, outside the watch halo."
  evenement.prologue.signaux.variante.standard: "Their lamps answer the lighthouse signal one by one."
  evenement.prologue.signaux.asset.alt: "Cutaway view of the caravan-city, with the lighthouse surrounded by its clustered mobile platforms."
  installation.cuisine.nom: "Preserving kitchen"
  installation.cuisine.service: "Prepare and preserve the caravan-city's rations."
  installation.cuisine.transformation: "Raw food → preserved rations"
  installation.cuisine.operationnelle: "Rations are prepared without additional losses."
  installation.cuisine.degradee: "Preservation consumes additional Food."
  installation.cuisine.hors-service: "No ration can be stabilized during the Halt."
  installation.filtration.nom: "Filtration station"
  installation.filtration.service: "Make water recovered on the road safe to drink."
  installation.filtration.transformation: "Raw water → drinking Water"
  installation.filtration.operationnelle: "The nominal drinking Water flow is maintained."
  installation.filtration.degradee: "Flow decreases and filters consume more Materials."
  installation.filtration.hors-service: "Water reserves can no longer be replenished."
  installation.dortoirs.nom: "Sealed dormitories"
  installation.dortoirs.service: "Shelter Inhabitants from ambient ash."
  installation.dortoirs.transformation: "Heat + filters → habitable volumes"
  installation.dortoirs.operationnelle: "The volumes remain sealed and heated."
  installation.dortoirs.degradee: "Heat demand rises and comfort falls."
  installation.dortoirs.hors-service: "The Inhabitants must be rehoused immediately."
  installation.infirmerie.nom: "Filtered infirmary"
  installation.infirmerie.service: "Treat emergencies without exposing patients or carers."
  installation.infirmerie.transformation: "Medicine → emergency care"
  installation.infirmerie.operationnelle: "Emergencies are treated in a protected volume."
  installation.infirmerie.degradee: "Care requires more Medicine and Labour."
  installation.infirmerie.hors-service: "Only first aid remains possible."
  installation.chaudiere.nom: "Common boiler"
  installation.chaudiere.service: "Distribute Heat to the mobile Quarters."
  installation.chaudiere.transformation: "Fuel → Heat"
  installation.chaudiere.operationnelle: "Nominal thermal production is available."
  installation.chaudiere.degradee: "Fuel consumption increases."
  installation.chaudiere.hors-service: "Non-priority volumes must shed their heating load."
  installation.traction.nom: "Traction unit"
  installation.traction.service: "Maintain the mobility of the clustered formation."
  installation.traction.transformation: "Fuel → traction"
  installation.traction.operationnelle: "The planned road speed remains available."
  installation.traction.degradee: "Consumption rises and the safe pace decreases."
  installation.traction.hors-service: "The Platform must be towed during travel."
  installation.atelier.nom: "On-board workshop"
  installation.atelier.service: "Repair installations and conduct Worksites."
  installation.atelier.transformation: "Materials → repairs and parts"
  installation.atelier.operationnelle: "Repairs and Worksites progress at the planned pace."
  installation.atelier.degradee: "Repairs and Worksites take longer."
  installation.atelier.hors-service: "No structural Worksite can progress."
  installation.operations.nom: "Operations post"
  installation.operations.service: "Prepare and monitor Expeditions from the caravan-city."
  installation.operations.transformation: "Intelligence → mandates and reports"
  installation.operations.operationnelle: "Reports and remote orders remain available."
  installation.operations.degradee: "Reports arrive later and with less context."
  installation.operations.hors-service: "No remote order can be transmitted."
  installation.condenseur.nom: "Thermal condenser"
  installation.condenseur.service: "Produce supplemental Water independently of a local source."
  installation.condenseur.transformation: "Fuel −2/h · Water +8/h"
  installation.condenseur.operationnelle: "The condenser provides 8 L of Water per hour."
  installation.condenseur.degradee: "Water output is halved without reducing consumption."
  installation.condenseur.hors-service: "The condenser provides no Water and must be isolated."
