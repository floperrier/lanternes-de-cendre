  evenement.veille-basse.cohorte.origine: "Lower Watch — sealed quarters"
  evenement.veille-basse.cohorte.titre: "Room beneath the dead lighthouse"
  evenement.veille-basse.cohorte.presentation: "Eighteen people from the Dike Camp reach Lower Watch. Exhausted but trained in sealed-frame carpentry, the Sillon Cohort asks for a lasting destination while the fragile Colony is already short of filters."
  evenement.veille-basse.cohorte.information: "The Cohort comes from the Dike Camp, numbers eighteen people, and knows how to make cracked chambers habitable."
  evenement.veille-basse.cohorte.information-charge: "Welcoming them will occupy the teams for ten minutes before two carpentry teams can join the convoy."
  evenement.veille-basse.cohorte.choix.accueillir: "Create a Welcoming Load in the caravan-city"
  evenement.veille-basse.cohorte.choix.accueillir.cout: "Known cost: shelter eighteen inhabitants immediately; gain two teams only after integration."
  evenement.veille-basse.cohorte.choix.refuser: "Close Lower Watch’s quarters"
  evenement.veille-basse.cohorte.choix.refuser.cout: "Known cost: the Cohort remains on the roads and this refusal will return to the Colony’s gates."
  evenement.veille-basse.cohorte.choix.rediriger: "Guarantee passage to Sillon Hospice"
  evenement.veille-basse.cohorte.choix.rediriger.cout: "Known cost: the Hospice carries the Load and will later ask for filtered spaces."
  evenement.veille-basse.cohorte.variante.standard: "Beneath the dead tower, every free bunk already has a name; the choice is which community will carry the newcomers."
  evenement.veille-basse.cohorte.asset.alt: "Cutaway of Lower Watch’s dead lighthouse: the Cohort waits before sealed rooms where residents and Pilgrims prepare bunks."
  evenement.veille-basse.porte.origine: "Lower Watch — filter gate"
  evenement.veille-basse.porte.titre: "The filter gate"
  evenement.veille-basse.porte.presentation: "An ash gust strains the outer airlock. Lower Watch is warned: without intervention, its two teams cannot maintain the filters, archives, and welcome at the same time."
  evenement.veille-basse.porte.information: "The technicians confirm two viable responses before the next gust; no loss is irreversible yet."
  evenement.veille-basse.porte.choix.sas: "Assign the technicians to reinforce the airlock"
  evenement.veille-basse.porte.choix.sas.cout: "Known cost: the filter market and archive opening must wait."
  evenement.veille-basse.porte.choix.hospice: "Open the Hospice’s filtered chambers"
  evenement.veille-basse.porte.choix.hospice.cout: "Known cost: Lower Watch remains fragile, but the welcoming Pressure shifts to the Hospice."
  evenement.veille-basse.porte.choix.renoncer: "Decline to intervene before the next gust"
  evenement.veille-basse.porte.choix.renoncer.cout: "Known cost: the opportunity will be recorded as ignored; Lower Watch will become lost at the next local Milestone."
  evenement.veille-basse.porte.variante.standard: "The locks shake; between two gusts, a window long enough to act remains."
  evenement.veille-basse.porte.asset.alt: "In Lower Watch’s airlock, two technicians hold a gate against the ash while Pilgrims point toward protected rooms still available."
  evenement.veille-basse.archives.origine: "Lower Watch technical archives"
  evenement.veille-basse.archives.titre: "The backflow records"
  evenement.veille-basse.archives.presentation: "Calibration maps show that the Ancient Network protected productive cities and pushed ash toward the Fractured Basins. Its loss of synchronization did not create the mass: it released what the peripheries had always received."
  evenement.veille-basse.archives.information: "Routes, maintenance dates, and displaced volumes agree; this revelation depends on no Companion’s testimony."
  evenement.veille-basse.archives.choix.copier: "Copy the records into the causal Journal"
  evenement.veille-basse.archives.choix.copier.cout: "Known cost: one technical team leaves the filters while securing the copy."
  evenement.veille-basse.archives.choix.laisser: "Leave the originals in Lower Watch’s care"
  evenement.veille-basse.archives.choix.laisser.cout: "Known cost: the caravan-city carries only a summary survey, but the revelation remains known."
  evenement.veille-basse.archives.variante.standard: "Across the table, every old curve converges on the same sacrificed territories."
  evenement.veille-basse.archives.asset.alt: "Archive room without readable text: engraved maps, conduits, and calibration drums show ash displaced from central lighthouses toward peripheral Basins."
  evenement.veille-basse.maelys.origine: "Lower Watch workshop"
  evenement.veille-basse.maelys.titre: "Maëlys and the sealed case"
  evenement.veille-basse.maelys.presentation: "Maëlys Rive, a technician of the dead lighthouse, offers her survey case to inspect the Hospice conduits. Her knowledge opens a more precise route; the carpentry teams can also succeed without her."
  evenement.veille-basse.maelys.information: "The case holds ancient gauges and a protocol Maëlys reconstructed, but no step requires her presence."
  evenement.veille-basse.maelys.choix.coffret: "Entrust the Hospice survey to Maëlys"
  evenement.veille-basse.maelys.choix.coffret.cout: "Known cost: Lower Watch temporarily loses one filter technician."
  evenement.veille-basse.maelys.choix.equipes: "Keep Maëlys on the filters and send the carpenters"
  evenement.veille-basse.maelys.choix.equipes.cout: "Known cost: the Hospice survey will be slower without blocking its reinforcement."
  evenement.veille-basse.maelys.variante.standard: "She sets the case between you without presenting her own presence as the price of success."
  evenement.veille-basse.maelys.asset.alt: "In a covered workshop, Maëlys offers the Lantern-Bearer a survey case while carpentry teams reinforce the Hospice in the background."
  evenement.haut-puits.pacte.origine: "High Well deep cistern"
  evenement.haut-puits.pacte.titre: "The cistern pact"
  evenement.haut-puits.pacte.presentation: "The Free Wells will open the cistern to displaced families if the caravan-city guarantees filtration parts until the Sluice Council."
  evenement.haut-puits.pacte.information: "The gauge register confirms that sharing would leave High Well fragile without immediately draining the cistern."
  evenement.haut-puits.pacte.choix.ouvrir: "Guarantee Water sharing"
  evenement.haut-puits.pacte.choix.ouvrir.cout: "Known cost: thirty litres of convoy Water will support the first distribution."
  evenement.haut-puits.pacte.choix.garantir: "Guarantee High Well’s autonomy first"
  evenement.haut-puits.pacte.choix.garantir.cout: "Known cost: displaced families will be turned away until the Sluice Council."
  evenement.haut-puits.pacte.variante.standard: "Level marks cross the cistern wall like the rings of an old debt."
  evenement.haut-puits.pacte.asset.alt: "Around the deep cistern valve, Free Wells delegates and displaced families await the Lantern-Bearer’s decision."
  evenement.haut-puits.vanniers.origine: "Basketmakers’ Path"
  evenement.haut-puits.vanniers.titre: "The Basketmakers under the plume"
  evenement.haut-puits.vanniers.presentation: "The convoy’s watch halo pushed an ash tongue towards the Basketmakers’ workshops. High Well asks who will carry the sludge needed to contain it."
  evenement.haut-puits.vanniers.information: "Dated readings link the plume to the last Route Commitment; the diversion remains passable, but there is no normal return."
  evenement.haut-puits.vanniers.choix.confiner: "Contain the sludge with convoy crews"
  evenement.haut-puits.vanniers.choix.confiner.cout: "Known cost: Maintenance crews will leave one worksite unattended during the next watch."
  evenement.haut-puits.vanniers.choix.deriver: "Divert the plume towards the empty basin"
  evenement.haut-puits.vanniers.choix.deriver.cout: "Known cost: the Free Wells will bring this new burden to the Sluice Council."
  evenement.haut-puits.vanniers.variante.standard: "Ash-coated reed baskets mark the drift all the way to the suspended workshops."
  evenement.haut-puits.vanniers.asset.alt: "The Basketmakers’ workshops sit beneath an ash plume marked by reed baskets."
  evenement.haut-puits.boues.origine: "Filter House"
  evenement.haut-puits.boues.titre: "What the Settler retains"
  evenement.haut-puits.boues.presentation: "The contained sludge proves that a Travelling Settler could secure contaminated sources, while the airlock plans could serve an Ark for the Displaced."
  evenement.haut-puits.boues.information: "Both projects require an entire chassis and remain incompatible with a free or instant transformation."
  evenement.haut-puits.boues.choix.decanteur: "Record the Travelling Settler process"
  evenement.haut-puits.boues.choix.decanteur.cout: "Known cost: residues would occupy Load and require lasting containment."
  evenement.haut-puits.boues.choix.arche: "Adapt the airlocks for the Ark for the Displaced"
  evenement.haut-puits.boues.choix.arche.cout: "Known cost: sheltering people would immediately increase Water, Food and Heat needs."
  evenement.haut-puits.boues.variante.standard: "Two sets of plans remain open side by side; neither alone determines the convoy’s future shape."
  evenement.haut-puits.boues.asset.alt: "Crews compare contained sludge with plans for a Travelling Settler and an Ark for the Displaced."
  evenement.haut-puits.ilyana.origine: "Distribution valve"
  evenement.haut-puits.ilyana.titre: "Ilyana at the last valve"
  evenement.haut-puits.ilyana.presentation: "Ilyana asks that every opening of the cistern record its beneficiaries and cost, even though the Free Wells consider such a register intrusive."
  evenement.haut-puits.ilyana.information: "Her proposal defends her belief in safe Water for everyone without granting her authority over the Council."
  evenement.haut-puits.ilyana.choix.confier: "Entrust her with the sharing register"
  evenement.haut-puits.ilyana.choix.confier.cout: "Known cost: her word will personally commit Stewardship at the Sluice Council."
  evenement.haut-puits.ilyana.choix.collectif: "Keep the register under collective arbitration"
  evenement.haut-puits.ilyana.choix.collectif.cout: "Known cost: Ilyana will remain consulted, but her guarantee will not be recognized."
  evenement.haut-puits.ilyana.variante.standard: "She places her pencil on the register rather than the valve, leaving the decision to the Lantern-Bearer."
  evenement.haut-puits.ilyana.asset.alt: "Ilyana holds an open register before the High Well valve while delegates await the decision."
  journal.titre.bassins.nacelles.accord-regional: "Counterweights shared between both banks"
  journal.titre.bassins.nacelles.passage-restreint: "Cable crossing reserved"
  journal.titre.bassins.nacelles.cible-frein-balisee: "Magnetic brake marked as a Covert Target"
  journal.titre.bassins.nacelles.cible-frein-consignee: "Magnetic brake recorded as a Covert Target"
  journal.titre.bassins.nacelles.frein-reaccorde: "Cable brake publicly retuned"
  journal.titre.bassins.nacelles.frein-transforme-clandestinement: "Cable brake covertly altered"
  journal.titre.bassins.nacelles.trace-laiton-persistante: "Persistent brass-filings Trace"
  journal.titre.bassins.nacelles.conseil-passage-partage: "Shared crossing prepared for the Council"
  journal.titre.bassins.nacelles.conseil-maintenance-commune: "Common maintenance prepared for the Council"
  journal.cause.bassins.nacelles.le-poids-des-deux-rives: "The weight of both banks"
  journal.cause.bassins.nacelles.le-frein-sous-la-cendre: "The brake beneath the ash"
  journal.cause.bassins.nacelles.la-main-sur-le-frein: "A hand on the brake"
  journal.cause.bassins.nacelles.deux-voix-dans-le-cable: "Two voices in the cable"
  journal.acteur.nacelliers-des-vannes: "Sluice Cable Crews"
  journal.acteur.frein-magnetique-des-nacelles: "Cableway Magnetic Brake"
  journal.cible.nacelliers-des-vannes: "Sluice Cable Crews"
  journal.cible.frein-magnetique-des-nacelles: "Cableway Magnetic Brake"
  evenement.nacelles.conflit.origine: "Cableway Relay"
  evenement.nacelles.conflit.titre: "The weight of both banks"
  evenement.nacelles.conflit.presentation: "The cableways cannot carry both High Well’s reserves and every family arriving from Lower Watch. The Free Wells and Ash Pilgrims each demand the priority promised upstream."
  evenement.nacelles.conflit.information: "The cost already paid to reach the Relay bears the mark of both Colonies, the Cohort, the plume and their Factions."
  evenement.nacelles.conflit.choix.partager: "Distribute the counterweights between both banks"
  evenement.nacelles.conflit.choix.partager.cout: "Known cost: 4 Materials reinforce the shared cages; no earlier choice is undone."
  evenement.nacelles.conflit.choix.reserver: "Reserve the next cage for the convoy"
  evenement.nacelles.conflit.choix.reserver.cout: "Known cost: 8 L of Water offset the wait imposed on travellers from both banks."
  evenement.nacelles.conflit.variante.ilyana-garante: "The register entrusted to Ilyana reaches the cable crews first: they treat High Well’s sharing guarantee as a commitment that can be challenged."
  evenement.nacelles.conflit.variante.ilyana-contredite: "The collective register arrives without a named guarantor: the cable crews require every High Well priority to be renegotiated at the Relay."
  evenement.nacelles.conflit.variante.maelys-mission: "The case entrusted to Maëlys documents loads from the lower bank: her mission gives Lower Watch technicians a voice in the allocation."
  evenement.nacelles.conflit.variante.maelys-equipes: "The teams kept at Lower Watch cannot reinforce the cables: their absence exposes the cost of prioritizing the Colony."
  evenement.nacelles.conflit.variante.veille-abandonnee: "The lower bank sends neither case nor crew: refusing to intervene at Lower Watch returns as an empty place in every cage."
  evenement.nacelles.conflit.variante.standard: "Both approach registers remain open side by side: no delegate can erase the opposite bank."
  evenement.nacelles.conflit.asset.alt: "Two suspended cable cages face one another above an ash basin while travellers from High Well and Lower Watch distribute counterweights."
  evenement.nacelles.mystere.origine: "Machinery beneath the Relay"
  evenement.nacelles.mystere.titre: "The brake beneath the ash"
  evenement.nacelles.mystere.presentation: "Beneath the main drum, an Ancient Network magnetic brake still modulates every load. Its pulses match the registers showing ash historically displaced toward the outskirts."
  evenement.nacelles.mystere.information: "The housing, power feed and transmission are located: the magnetic brake is now a concrete Covert Target limited to this crossing."
  evenement.nacelles.mystere.choix.baliser: "Mark the housing and its telltales"
  evenement.nacelles.mystere.choix.baliser.cout: "Known cost: the Cable Crews will know exactly which infrastructure was designated."
  evenement.nacelles.mystere.choix.consigner: "Record the brake in the causal Journal"
  evenement.nacelles.mystere.choix.consigner.cout: "Known cost: the intelligence leaves the technicians’ circle without launching an operation."
  evenement.nacelles.mystere.variante.standard: "The brass plate bears the same pattern as the reflux curves copied at Lower Watch."
  evenement.nacelles.mystere.asset.alt: "Beneath a cable drum, technicians discover an old magnetic brake connected to a brass plate and mark it without touching it."
  evenement.nacelles.systeme.origine: "Cableway Magnetic Brake"
  evenement.nacelles.systeme.titre: "A hand on the brake"
  evenement.nacelles.systeme.presentation: "The revealed Target can be repaired openly or altered without consent so loads can no longer be discriminated. The hidden operation would affect a precise infrastructure and leave room for an investigation."
  evenement.nacelles.systeme.information: "Opening the housing scatters identifiable brass filings; they will survive the regional transition as a Covert Trace."
  evenement.nacelles.systeme.choix.reparer: "Retune the brake publicly"
  evenement.nacelles.systeme.choix.reparer.cout: "Known cost: 6 Materials and the Cable Crews’ public agreement."
  evenement.nacelles.systeme.choix.clandestin: "Covertly alter the revealed brake"
  evenement.nacelles.systeme.choix.clandestin.cout: "Known cost: 2 Materials; a persistent Trace may later support doubt, accusation or proof."
  evenement.nacelles.systeme.variante.standard: "The housing remains open before you; the difference between repair and hidden intervention is explicit."
  evenement.nacelles.systeme.asset.alt: "A gloved hand hesitates above the open magnetic brake while bright brass filings fall onto a survey cloth."
  evenement.nacelles.compagnons.origine: "Relay footbridge"
  evenement.nacelles.compagnons.titre: "Two voices in the cable"
  evenement.nacelles.compagnons.presentation: "Ilyana Voss argues for a shared crossing register; Maëlys Rive wants crews able to maintain the cables to move between Colonies. They frame two options compatible with established facts without claiming personal authority."
  evenement.nacelles.compagnons.information.ilyana: "Ilyana links the shared-crossing proposal to the water commitments made at High Well."
  evenement.nacelles.compagnons.information.maelys: "Maëlys links common maintenance to the Cohort’s fate and Lower Watch’s technicians."
  evenement.nacelles.compagnons.choix.partage: "Bring shared passage before the Sluice Council"
  evenement.nacelles.compagnons.choix.partage.cout: "Known cost: crossing priorities must remain public and open to challenge."
  evenement.nacelles.compagnons.choix.maintenance: "Bring common maintenance before the Sluice Council"
  evenement.nacelles.compagnons.choix.maintenance.cout: "Known cost: each Colony will periodically assign one crew to the Relay."
  evenement.nacelles.compagnons.variante.standard: "The two Companions speak from different banks, then knot their proposals to the same cable."
  evenement.nacelles.compagnons.asset.alt: "Ilyana and Maëlys stand on a cableway footbridge, one holding a register and the other a survey case, facing cables stretched toward both banks."
  journal.titre.bassins.deversoir.ligne-zero-relevee: "The Zero Line interface was surveyed"
  journal.titre.bassins.deversoir.ligne-zero-preservee: "The Zero Line conduit was preserved"
  journal.titre.bassins.deversoir.conseil-convoque: "The delegations were summoned to the Sluices"
  journal.titre.bassins.deversoir.conseil-public: "The water accounts were made public"
  journal.titre.bassins.deversoir.transformation-scellee: "The regional transformation was sealed"
  journal.titre.bassins.deversoir.gabarits-conserves: "The regional templates were preserved"
  journal.titre.bassins.deversoir.passage-prepare: "The abandoned places were recorded before passage"
  journal.titre.bassins.deversoir.passage-transmis: "The Basins’ registers were handed on"
  journal.cause.bassins.deversoir.la-conduite-zero: "Decision made before the Black Spillway’s revealed conduit."
  journal.cause.bassins.deversoir.la-tempete-aux-vannes: "Decision made during the storm saturating both Colonies’ filters."
  journal.cause.bassins.deversoir.le-chassis-des-bassins: "Decision made before the frame built to carry the regional transformation."
  journal.cause.bassins.deversoir.le-passage-sans-retour: "Decision made before irreversible passage into the Iron Weave."
  journal.acteur.techniciens-du-deversoir: "Spillway Technicians"
  journal.cible.conduite-de-la-ligne-zero: "Zero Line Conduit"
  journal.cible.conseil-des-vannes: "Sluice Council"
  journal.cible.chassis-regional-des-bassins: "Basins Regional Frame"
  journal.cible.passage-vers-la-trame: "Passage into the Iron Weave"
  journal.cible.habitants-des-bassins: "People of the Basins"
  evenement.deversoir.ligne-zero.origine: "Beneath the Black Spillway slabs"
  evenement.deversoir.ligne-zero.titre: "The Zero Conduit"
  evenement.deversoir.ligne-zero.presentation: "A broken slab exposes an annular Ancient Network conduit. Its markings describe the first legible Zero Line: a buried service route already running toward the Iron Weave."
  evenement.deversoir.ligne-zero.information: "The technicians isolate a usable interface. Surveying it will provide concrete intelligence on the next Region’s access points."
  evenement.deversoir.ligne-zero.choix.relever: "Survey the interface before closing the slab"
  evenement.deversoir.ligne-zero.choix.relever.cout: "Known cost: the survey will be public and the Spillway will know what you carry."
  evenement.deversoir.ligne-zero.choix.poumon: "Preserve the conduit as the Basins’ lung"
  evenement.deversoir.ligne-zero.choix.poumon.cout: "Known cost: no dismantled part will reinforce the convoy before passage."
  evenement.deversoir.ligne-zero.variante.harmonique: "The harmonic recorded at departure returns among the maintenance marks."
  evenement.deversoir.ligne-zero.variante.signal: "The signal smothered at departure is missing from the sequence; the interface identifies the gap."
  evenement.deversoir.ligne-zero.variante.standard: "The markings alternate ventilation, load shedding and service access."
  evenement.deversoir.ligne-zero.asset.alt: "A cracked slab reveals an ancient circular conduit beneath ash basins while technicians survey its markings."
  evenement.deversoir.tempete.origine: "Sluice Table"
  evenement.deversoir.tempete.titre: "The storm at the sluices"
  evenement.deversoir.tempete.presentation: "Ash clogs Lower Watch’s filters while High Well holds the last clear reserves. The delegations demand a common rule before the passage opens."
  evenement.deversoir.tempete.information: "Sharing, repairing the settler and redirecting the Cohort will appear only when earlier decisions make them real. Coercion will remain explicit."
  evenement.deversoir.tempete.choix.delegations: "Summon every delegation around the table"
  evenement.deversoir.tempete.choix.delegations.cout: "Known cost: the Colonies will also hear the options they reject."
  evenement.deversoir.tempete.choix.comptes: "Publish reserves and losses before sitting"
  evenement.deversoir.tempete.choix.comptes.cout: "Known cost: neither camp can conceal its fragility after the Council."
  evenement.deversoir.tempete.variante.maintenance: "The common maintenance pledge carried from the Cableways already guarantees crews at the Relay; each Colony must now honor that obligation."
  evenement.deversoir.tempete.variante.accord: "The agreement carried from the Cableways already supplies a challengeable crossing procedure."
  evenement.deversoir.tempete.variante.perte: "Lower Watch’s refusal returns as an empty filter and a delegation without a crew."
  evenement.deversoir.tempete.variante.standard: "Every seat corresponds to a verifiable reserve, debt or absence."
  evenement.deversoir.tempete.asset.alt: "Four delegations surround a round mechanical table while an ash storm strikes the Black Spillway sluices."
  evenement.deversoir.chassis.origine: "Spillway Workshop"
  evenement.deversoir.chassis.titre: "The Basins’ frame"
  evenement.deversoir.chassis.presentation: "The workshops translate the Council’s decision into transportable frames. The settler or the Ark will become a major convoy transformation, never a final answer to the Iron Weave."
  evenement.deversoir.chassis.information: "Rejected plans remain legible: they can return in a report, a debt or another construction."
  evenement.deversoir.chassis.choix.sceller: "Seal the chosen transformation into the frame"
  evenement.deversoir.chassis.choix.sceller.cout: "Known cost: 12 Materials and the whole chassis; this shape will follow the convoy and restrict later replacements."
  evenement.deversoir.chassis.choix.gabarits: "Close the chassis as a Standard Platform and preserve the templates"
  evenement.deversoir.chassis.choix.gabarits.cout: "Known cost: the chassis gains three ordinary Slots but gives up carrying a Major Project in this Region."
  evenement.deversoir.chassis.variante.decanteur: "The old settler’s arms outline mobile purification at convoy scale."
  evenement.deversoir.chassis.variante.arche: "The Ark’s ribs reserve bays for displaced people and their trades."
  evenement.deversoir.chassis.variante.aucune: "No major project was chosen; the frame keeps several incompatible fittings."
  evenement.deversoir.chassis.asset.alt: "A vast rolling frame receives settler and ark components in an ash workshop lit by lanterns."
  evenement.deversoir.passage.origine: "Threshold of the Iron Weave"
  evenement.deversoir.passage.titre: "The passage without return"
  evenement.deversoir.passage.presentation: "The Spillway’s rear accesses will be condemned once the convoy commits. Before leaving the Basins, the Council names the abandoned places, weakened Colonies and still-open opportunities."
  evenement.deversoir.passage.information: "The Journal will retain these absences as causes for reports and the epilogue; the regional passage itself cannot be undone."
  evenement.deversoir.passage.choix.consigner: "Record every abandonment and opportunity"
  evenement.deversoir.passage.choix.consigner.cout: "Known cost: the convoy carries a public debt to the places it leaves."
  evenement.deversoir.passage.choix.transmettre: "Hand the registers to the people who remain"
  evenement.deversoir.passage.choix.transmettre.cout: "Known cost: the Basins retain their own evidence and can challenge your account."
  evenement.deversoir.passage.variante.haut-puits: "High Well keeps a guarantor and a pact whose effects survive your departure."
  evenement.deversoir.passage.variante.veille-basse: "Lower Watch keeps Maëlys’s mission and the crews whose priority you set."
  evenement.deversoir.passage.variante.standard: "Both Colonies appear in the register, including through refusals and empty places."
  evenement.deversoir.passage.asset.alt: "A convoy enters a metal corridor as a gate closes behind it, with registers of the abandoned places still visible."
  conseil.des-vannes.titre: "Sluice Council"
  conseil.des-vannes.sujet.titre: "Water, Cohort and regional passage"
  conseil.des-vannes.voix.fait-connu: "The reserves, settler and Cohort can be defended only if they were prepared in the Colonies."
  conseil.des-vannes.voix.source: "Cross-checked registers from High Well, Lower Watch and the Cableways"
  conseil.des-vannes.voix.date: "During the storm at the Black Spillway"
  conseil.des-vannes.voix.recommandation: "Ilyana recommends the sole option backed by public facts and durable responsibility."
  conseil.des-vannes.voix.enjeu: "A decision without evidence would turn Stewardship into an authority without appeal."
  conseil.des-vannes.decision.partager: "Share the reserves between both Colonies"
  conseil.des-vannes.decision.decanteur: "Repair the old settler as a major project"
  conseil.des-vannes.decision.cohorte: "Redirect the Cohort into an Ark for the displaced"
  conseil.des-vannes.decision.contraindre: "Force the sluices and own the coercion"
  journal.conseil.des-vannes.partager.titre: "Both Colonies’ reserves were placed in common"
  journal.conseil.des-vannes.decanteur.titre: "The old settler was chosen as a convoy transformation"
  journal.conseil.des-vannes.cohorte.titre: "The Cohort was redirected into an Ark for the displaced"
  journal.conseil.des-vannes.contraindre.titre: "The sluices were forced in the name of passage"
  journal.conseil.des-vannes.cause: "Decision of the Sluice Council summoned by the Black Spillway storm."
